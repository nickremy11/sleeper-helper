<style>

/* ── BANNER ── */
.banner-inner {
  position: relative; z-index: 1;
  max-width: 960px; margin: 0 auto;
  padding: 24px 32px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}

/* ── MAIN ── */
.main { max-width: 960px; margin: 0 auto; padding: 28px 24px 80px; }

/* ── SECTION HEAD ── */
.section-head { margin-bottom: 16px; }
.section-head h2 { font-size: 1rem; }

/* ── SETUP CARD ── */
.setup-card {
  background: var(--brown-dark); border: 2px solid var(--brown-mid); border-radius: 2px;
  padding: 18px 22px; margin-bottom: 22px; box-shadow: 4px 4px 0 var(--brown-mid);
}
.setup-label { font-family: var(--font-display), serif; font-size: 0.65rem; margin-bottom: 7px; }
.setup-row { display: flex; gap: 8px; }
.setup-input { font-family: var(--font-body), serif; padding: 7px 12px; }

.setup-btn {
  background: var(--green); border: 2px solid var(--gold); color: var(--gold-light);
  font-family: var(--font-display), serif; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 0 16px; cursor: pointer; border-radius: 2px; transition: background 0.2s, color 0.2s; white-space: nowrap;
}

.setup-status { font-family: var(--font-body), serif; margin-top: 5px; min-height: 16px; }

.setup-status.err { color: var(--c-red); }

/* ── WEEK CONTROLS ── */
.week-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  background: var(--brown-dark); border: 1px solid var(--brown-mid); border-radius: 2px; padding: 10px 16px;
}
.week-label { font-family: var(--font-display), serif; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.week-num { font-family: var(--font-head), serif; font-size: 1.1rem; font-weight: 700; color: var(--cream); min-width: 28px; text-align: center; }
.week-arrow { background: none; border: 1px solid var(--brown-mid); color: var(--brown-light); width: 28px; height: 28px; cursor: pointer; border-radius: 2px; font-size: 0.8rem; line-height: 1; transition: border-color 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; }
.week-arrow:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.week-arrow:disabled { opacity: 0.3; cursor: default; }
.load-btn {
  margin-left: auto;
  background: var(--green); border: 2px solid var(--gold); color: var(--gold-light);
  font-family: var(--font-display), serif; font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 7px 18px; cursor: pointer; border-radius: 2px; transition: background 0.2s, color 0.2s;
}
.load-btn:hover { background: var(--gold); color: var(--brown-dark); }
.load-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.week-at { margin-left: auto; font-family: var(--font-body), serif; font-size: 0.85rem; font-style: italic; color: var(--brown-light); white-space: nowrap; }
.week-auto { display: flex; align-items: center; gap: 4px; font-family: var(--font-body), serif; font-size: 0.85rem; color: var(--brown-light); cursor: pointer; white-space: nowrap; }
.week-auto input { accent-color: var(--gold); margin: 0; }
.week-at + .week-auto + .load-btn { margin-left: 0; }

/* ── LEAGUE TABLE ── */
.league-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
.league-table th {
  font-family: var(--font-display), serif; font-size: 0.63rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); text-align: left; padding: 6px 10px; border-bottom: 2px solid var(--brown-mid);
}
.league-table th.center { text-align: center; }
.league-table td { padding: 7px 10px; border-bottom: 1px dashed rgba(var(--tint),0.07); vertical-align: middle; }
.league-table tr:last-child td { border-bottom: none; }
.league-table tr:hover td { background: rgba(var(--tint),0.02); }
.league-name { font-family: var(--font-body), serif; font-size: 0.95rem; color: var(--parchment); }
.league-type { font-family: var(--font-display), serif; font-size: 0.61rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brown-light); margin-top: 1px; }
.value-input {
  width: 80px; background: rgba(var(--tint),0.05); border: 1px solid var(--brown-mid);
  color: var(--cream); font-family: var(--font-body), serif; font-size: 0.95rem;
  padding: 4px 8px; border-radius: 2px; outline: none; text-align: right; transition: border-color 0.2s;
}
.value-input:focus { border-color: var(--gold); }
.value-input::placeholder { color: rgba(var(--tint),0.2); }
.contender-check { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; display: block; margin: 0 auto; }
.leagues-card {
  background: var(--brown-dark); border: 2px solid var(--brown-mid); border-radius: 2px;
  padding: 0 4px; margin-bottom: 20px; box-shadow: 4px 4px 0 var(--brown-mid);
}

/* ── LEAGUES COLLAPSIBLE ── */
details.leagues-details > summary {
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; list-style: none;
  padding: 6px 0; margin-bottom: 16px; user-select: none;
}
details.leagues-details > summary::-webkit-details-marker { display: none; }
details.leagues-details > summary::marker { display: none; }
.leagues-toggle {
  font-size: 0.65rem; color: var(--gold);
  transition: transform 0.2s; flex-shrink: 0;
}
details.leagues-details[open] > summary .leagues-toggle { transform: rotate(90deg); }
.leagues-summary-head { font-family: var(--font-display), serif; font-size: 1rem; color: var(--brown-dark); white-space: nowrap; }
.leagues-summary-info {
  font-family: var(--font-body), serif; font-size: 0.85rem;
  color: var(--brown-light); font-style: italic; white-space: nowrap; flex-shrink: 0;
}

/* ── STATES (rootforme override) ── */
.err-state {
  background: rgba(139,26,26,0.2); border: 1px solid var(--red); color: var(--c-red);
}

/* ── GAME CARDS ── */
.game-card {
  background: var(--brown-dark); border: 1px solid var(--brown-mid); border-radius: 2px;
  margin-bottom: 10px; overflow: hidden; box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
}
.game-header {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  cursor: pointer; user-select: none; transition: background 0.15s;
}
.game-header:hover { background: rgba(var(--tint),0.03); }
.game-teams { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.game-team {
  font-family: var(--font-display), serif; font-size: 0.75rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cream);
}
.game-at { font-family: var(--font-body), serif; font-size: 0.8rem; color: var(--brown-light); }
.game-time { font-family: var(--font-body), serif; font-size: 0.85rem; color: var(--brown-light); font-style: italic; }
.game-pill {
  font-family: var(--font-display), serif; font-size: 0.61rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px; white-space: nowrap;
}
.game-pill-mine { background: rgba(45,74,30,0.4); border: 1px solid rgba(74,122,47,0.5); color: var(--green-light); }
.game-pill-opp  { background: rgba(139,26,26,0.3); border: 1px solid rgba(139,26,26,0.5); color: var(--c-red); }
.game-toggle { font-size: 0.65rem; color: var(--brown-light); transition: transform 0.2s; flex-shrink: 0; }
.game-card.open .game-toggle { transform: rotate(90deg); }

.game-body { display: none; border-top: 1px solid var(--brown-mid); }
.game-card.open .game-body { display: block; }

/* ── GAME SPLIT ── */
.game-split {
  display: grid; grid-template-columns: 1fr 1px 1fr; gap: 0;
}
@media (max-width: 560px) {
  .game-split { grid-template-columns: 1fr; }
  .game-col-divider { display: none; }
}
.game-col { padding: 12px 16px; }
.game-col-divider { background: var(--brown-mid); }
.game-col-header {
  font-family: var(--font-display), serif; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(var(--tint),0.08);
}
.game-col-empty { font-family: var(--font-body), serif; font-style: italic; font-size: 0.85rem; color: var(--brown-light); padding: 4px 0; }

/* ── PLAYER ROWS ── */
.player-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 6px; margin-bottom: 2px; border-radius: 2px;
  cursor: pointer; transition: background 0.15s; position: relative;
}
.player-row:hover { background: rgba(var(--tint),0.05); }
.player-row.active { background: rgba(201,150,42,0.12); }
.player-pos {
  font-family: var(--font-display), serif; font-size: 0.61rem; letter-spacing: 0.08em; text-transform: uppercase;
  width: 28px; flex-shrink: 0; padding: 2px 4px; border-radius: 2px; text-align: center;
  background: rgba(var(--tint),0.06); color: var(--brown-light);
}
.pos-qb  .player-pos { background: rgba(224,82,82,0.18);  color: var(--c-red); }
.pos-rb  .player-pos { background: rgba(92,184,92,0.18);  color: var(--c-green); }
.pos-wr  .player-pos { background: rgba(91,192,222,0.18); color: var(--c-teal); }
.pos-te  .player-pos { background: rgba(232,115,75,0.18); color: var(--c-orange); }
.pos-dl  .player-pos,
.pos-de  .player-pos,
.pos-dt  .player-pos,
.pos-nt  .player-pos { background: rgba(155,89,182,0.18); color: var(--c-purple); }
.pos-lb  .player-pos,
.pos-ilb .player-pos,
.pos-olb .player-pos,
.pos-mlb .player-pos { background: rgba(41,128,185,0.18); color: var(--c-blue); }
.pos-db  .player-pos,
.pos-cb  .player-pos,
.pos-s   .player-pos,
.pos-ss  .player-pos,
.pos-fs  .player-pos,
.pos-saf .player-pos { background: rgba(26,188,156,0.18); color: #0f7a66; }
.pos-k   .player-pos { background: rgba(149,165,166,0.18); color: var(--c-grey); }
.pos-def .player-pos { background: rgba(231,76,60,0.18);  color: var(--c-red); }

.player-name { font-family: var(--font-body), serif; font-size: 0.95rem; color: var(--parchment); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-count { color: var(--brown-light); font-size: 0.82rem; }
.root-chip {
  font-family: var(--font-head), serif; font-size: 0.78rem; font-weight: 700;
  min-width: 34px; text-align: center; padding: 2px 6px; border-radius: 3px;
  color: #fff; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}

/* ── PLAYER DETAIL POPOVER ── */
.player-detail {
  margin: 0 8px 10px; padding: 12px 14px;
  background: rgba(var(--tint),0.04); border: 1px solid var(--brown-mid); border-radius: 2px;
}
.detail-name { font-family: var(--font-head), serif; font-weight: 700; font-size: 1rem; color: var(--cream); margin-bottom: 4px; }
.detail-score-line {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.detail-root-chip {
  font-family: var(--font-head), serif; font-size: 1.2rem; font-weight: 700;
  padding: 3px 12px; border-radius: 3px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.detail-score-label { font-family: var(--font-body), serif; font-size: 0.88rem; font-style: italic; color: var(--brown-light); }
.detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .detail-cols { grid-template-columns: 1fr; } }
.detail-section-label {
  font-family: var(--font-display), serif; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 5px;
}
.detail-league {
  font-family: var(--font-body), serif; font-size: 0.85rem; color: var(--parchment);
  padding: 2px 0; border-bottom: 1px dashed rgba(var(--tint),0.07);
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.detail-league:last-child { border-bottom: none; }
.detail-league-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.detail-league-pts { color: var(--brown-light); font-size: 0.82rem; }
.detail-league-val { color: var(--gold-light); }
.detail-none { font-family: var(--font-body), serif; font-style: italic; font-size: 0.85rem; color: var(--brown-light); }

/* ── PLAYERS SECTION ── */
details.players-outer > summary {
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; list-style: none;
  padding: 6px 0; margin-bottom: 0; user-select: none;
}
details.players-outer > summary::-webkit-details-marker { display: none; }
details.players-outer > summary::marker { display: none; }
details.players-outer[open] > summary { margin-bottom: 14px; }
.players-toggle { font-size: 0.65rem; color: var(--gold); transition: transform 0.2s; flex-shrink: 0; }
details.players-outer[open] > summary .players-toggle { transform: rotate(90deg); }
.players-summary-head { font-family: var(--font-display), serif; font-size: 1rem; color: var(--brown-dark); white-space: nowrap; }
.players-summary-info { font-family: var(--font-body), serif; font-size: 0.85rem; color: var(--brown-light); font-style: italic; white-space: nowrap; flex-shrink: 0; }
.pos-group-wrap { border-top: 1px solid rgba(var(--tint),0.07); }
.pos-group-wrap:first-child { border-top: none; }
details.pos-group > summary {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; list-style: none;
  padding: 9px 12px; user-select: none;
  transition: background 0.15s;
}
details.pos-group > summary:hover { background: rgba(var(--tint),0.02); }
details.pos-group > summary::-webkit-details-marker { display: none; }
details.pos-group > summary::marker { display: none; }
.pos-group-toggle { font-size: 0.64rem; color: var(--brown-light); transition: transform 0.2s; flex-shrink: 0; }
details.pos-group[open] > summary .pos-group-toggle { transform: rotate(90deg); }
.pos-group-label { font-family: var(--font-display), serif; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.pos-group-count { font-family: var(--font-body), serif; font-size: 0.82rem; color: var(--brown-light); font-style: italic; }
.pos-group-body { padding: 2px 12px 10px; }

/* ── MONDAY NIGHT MIRACLE ── */
.mnm-card {
  background: var(--brown-dark); border: 2px solid var(--brown-mid); border-radius: 2px;
  box-shadow: 4px 4px 0 var(--brown-mid); margin-bottom: 16px; padding: 14px 16px;
}
.mnm-label { font-family: var(--font-display), serif; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.mnm-games { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.mnm-game { font-family: var(--font-body), serif; font-size: 0.9rem; color: var(--parchment); background: rgba(var(--tint),0.05); border: 1px solid var(--brown-mid); padding: 3px 10px; border-radius: 2px; }
.mnm-game b { font-family: var(--font-display), serif; font-size: 0.6rem; letter-spacing: 0.08em; color: var(--cream); font-weight: normal; }
.mnm-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.mnm-tile { background: rgba(var(--tint),0.04); border: 1px solid var(--brown-mid); border-radius: 2px; padding: 8px 10px; }
.mnm-tile-v { font-family: var(--font-head), serif; font-weight: 700; font-size: 1.25rem; color: var(--cream); }
.mnm-tile-l { font-family: var(--font-display), serif; font-size: 0.61rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brown-light); margin-top: 2px; }
.mnm-tile-s { font-family: var(--font-body), serif; font-size: 0.8rem; font-style: italic; color: var(--brown-light); }
.mnm-note { font-family: var(--font-body), serif; font-size: 0.85rem; font-style: italic; color: var(--brown-light); margin-top: 10px; }
.mnm-good { color: var(--green-light); }
.mnm-bad  { color: var(--c-red); }

.mnm-lev-row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto 64px; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px dashed rgba(var(--tint),0.07); }
.mnm-lev-row:last-child { border-bottom: none; }
.mnm-lev-name { font-family: var(--font-body), serif; font-size: 0.95rem; color: var(--parchment); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mnm-lev-sub { font-family: var(--font-body), serif; font-size: 0.8rem; color: var(--brown-light); white-space: normal; }
.mnm-lev-range { font-family: var(--font-body), serif; font-size: 0.8rem; color: var(--brown-light); white-space: nowrap; text-align: right; }
.mnm-chip { font-family: var(--font-head), serif; font-size: 0.8rem; font-weight: 700; text-align: center; padding: 2px 6px; border-radius: 3px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

.mnm-mu { padding: 10px 4px 12px; border-bottom: 1px dashed rgba(var(--tint),0.09); }
.mnm-mu:last-child { border-bottom: none; }
.mnm-mu-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mnm-mu-name { font-family: var(--font-body), serif; font-weight: 600; font-size: 1rem; color: var(--parchment); flex: 1; min-width: 0; }
.mnm-mu-val { font-family: var(--font-body), serif; color: var(--gold-light); }
.mnm-mu-score { font-family: var(--font-head), serif; font-size: 0.95rem; color: var(--cream); white-space: nowrap; }
.mnm-bar { position: relative; height: 6px; background: rgba(224,128,128,0.35); border-radius: 3px; margin: 7px 0 6px; overflow: hidden; }
.mnm-bar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green-light); }
.mnm-need { font-family: var(--font-body), serif; font-size: 0.92rem; color: var(--parchment); }
.mnm-need b { color: var(--gold-light); }
.mnm-opt { font-family: var(--font-body), serif; font-size: 0.85rem; color: var(--brown-light); font-style: italic; margin-top: 2px; }
.mnm-rem { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-family: var(--font-body), serif; font-size: 0.82rem; }
.mnm-rem span { padding: 1px 7px; border-radius: 2px; }
.mnm-rem .mine   { background: rgba(45,74,30,0.4); border: 1px solid rgba(74,122,47,0.5); color: var(--green-light); }
.mnm-rem .theirs { background: rgba(139,26,26,0.3); border: 1px solid rgba(139,26,26,0.5); color: var(--c-red); }

.mnm-win { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: start; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed rgba(var(--tint),0.07); }
.mnm-win:last-child { border-bottom: none; }
.mnm-win .player-pos { margin-top: 3px; }
.mnm-tr-wrap { overflow-x: auto; margin-top: 6px; }
.mnm-tr { border-collapse: collapse; width: 100%; font-family: var(--font-body), serif; font-size: 0.86rem; color: var(--parchment); }
.mnm-tr th { font-family: var(--font-display), serif; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; text-align: left; color: var(--gold); padding: 4px 8px; border-bottom: 1px solid var(--brown-mid); white-space: nowrap; }
.mnm-tr th.mnm-good { color: var(--green-light); } .mnm-tr th.mnm-bad { color: var(--c-red); }
.mnm-tr td { padding: 5px 8px; border-bottom: 1px dashed rgba(var(--tint),0.07); vertical-align: top; }
.mnm-tr td b { font-weight: 600; color: var(--cream); }
.mnm-tr-tag { display: block; font-style: italic; font-size: 0.78rem; color: var(--brown-light); }
.mnm-tr-td { font-family: var(--font-display), serif; font-size: 0.61rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-right: 4px; }
.mnm-need-p { margin-top: 5px; padding-left: 8px; border-left: 2px solid var(--brown-mid); font-size: 0.88rem; }
.mnm-win-k { font-family: var(--font-body), serif; font-size: 0.88rem; color: var(--parchment); display: flex; gap: 8px; }
.mnm-win-k > span:first-child { font-family: var(--font-display), serif; font-size: 0.61rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); width: 44px; flex-shrink: 0; padding-top: 4px; }
.mnm-win-k b { font-weight: 600; color: var(--cream); }
@media (max-width: 640px) {
  .mnm-lev-row { grid-template-columns: 34px minmax(0,1fr) 60px; }
  .mnm-lev-range { display: none; }
}

<script src="/shared-nav.js?v=20261122"></script>
  <script src="/shared-auth.js?v=20261124"></script>
<script src="/shared-core.js?v=20261117"></script>
<script src="/shared-utils.js?v=20261124"></script>
<script src="/miracle.js?v=20261117"></script>
<script src="/matchup-tracker.js?v=20261123"></script>
<script src="/league-matchups.js?v=20261123"></script>
<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const API = SH_API;

const POS_RANK = {
  QB:0, RB:1, WR:2, TE:3,
  DL:4, DE:4, DT:4, NT:4,
  LB:5, ILB:5, OLB:5, MLB:5,
  DB:6, CB:6, S:6, SS:6, FS:6, SAF:6,
  K:7, DEF:8,
};

const DEF_POSITIONS = new Set(['DL','DE','DT','NT','LB','ILB','OLB','MLB','DB','CB','S','SS','FS','SAF','DEF']);

// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  auth:            null,
  username:        '',
  userId:          '',
  season:          String(new Date().getFullYear()),
  week:            1,
  leagues:         [],
  espnSettings:    null,
  prefs:           {},
  playerMap:       {},
  nflGames:        [],
  matchupResults:  [],
  mnmStats:        null, // Sleeper week stats {pid: line} — Monday Night Miracle
  mnmProj:         null, // Sleeper week projections {pid: line}
  mnmCtx:          null, // mnmBuild() output for the last load
  mnmRes:          null, // mnmRun() output
  mnmToken:        0,    // drops a stale sim when Load is pressed again mid-run
  espnSkips:       [], // [{name, reason}] — ESPN leagues that dropped out of a load
  processedGames:  null, // cached after loadMatchups
  activeDetail:    null, // { gameKey, pid }
  psActiveDetail:  null, // pid for players section
  rid:             {},   // {lgId: my roster_id} — Sleeper; persisted per season, so a load/refresh reads /matchups only
  loadSeq:         0,    // bumped by every load + refresh; a stale one drops its result
  loadedWeek:      null, // the week currently on screen (null until the first load lands)
  at:              null, // when the scores on screen were read
  refreshing:      false,
  mnmAutoWeek:     null, // the Miracle auto-opens once per week, so a Refresh never re-opens one you closed
};

const RFM_AUTO_MS = 120000;   // auto-refresh cadence while an NFL game is in progress

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const user = await SharedAuth.init({
    chipContainerId: 'auth-chip',
    onLogin: async (u) => {
      S.auth = u;
      updateSetupVisibility();
      if (u.sleeper_username && !S.username) {
        S.username = u.sleeper_username;
        document.getElementById('username-input').value = S.username;
        await loadLeagues();
      } else if (S.leagues.length) {
        await loadPrefs();
      }
    },
    onLogout: () => { S.auth = null; updateSetupVisibility(); },
  });
  S.auth = user;
  const stored   = localStorage.getItem('rfm_username');
  const fromAuth = S.auth?.sleeper_username;
  // When signed in, the Sleeper username is tied to the account (changed on ffhistorian.com/profile).
  S.username = S.auth ? (fromAuth || '') : (stored || '');
  updateSetupVisibility();
  if (S.username) {
    document.getElementById('username-input').value = S.username;
    await loadLeagues();
  }
}

function updateSetupVisibility() {
  const setup = document.getElementById('setup-section');
  const hint  = document.getElementById('profile-hint-section');
  if (!setup || !hint) return;
  if (S.auth) {
    setup.style.display = 'none';
    hint.style.display  = S.auth.sleeper_username ? 'none' : '';
  } else {
    setup.style.display = '';
    hint.style.display  = 'none';
  }
}

// ── Username / League Load ────────────────────────────────────────────────────
async function submitUsername() {
  const val = document.getElementById('username-input').value.trim();
  if (!val) return;
  S.username = val;
  localStorage.setItem('rfm_username', val);
  await loadLeagues();
}

async function loadLeagues() {
  const statusEl = document.getElementById('setup-status');
  const btn      = document.getElementById('username-btn');
  btn.disabled   = true;
  statusEl.className = 'setup-status';
  statusEl.textContent = 'Loading…';

  try {
    const userRes = await fetch(`${API}/sleeper/user/${S.username}`);
    if (!userRes.ok) throw new Error('User not found');
    const user = await userRes.json();
    if (!user.user_id) throw new Error('User not found');
    S.userId = user.user_id;

    const stateRes = await fetch(`${API}/sleeper/state/nfl`);
    const nflState = await stateRes.json();
    S.season = nflState.season || S.season;
    S.week   = nflState.display_week || nflState.week || 1;

    const lgRes = await fetch(`${API}/sleeper/user/${S.userId}/leagues/nfl/${S.season}`);
    S.leagues = (await lgRes.json()) || [];

    await loadEspnLeagues();
    await loadPrefs();

    statusEl.className  = 'setup-status ok';
    statusEl.textContent = `Loaded ${S.leagues.length} league${S.leagues.length !== 1 ? 's' : ''}`;
    document.getElementById('week-section').style.display    = '';
    document.getElementById('week-num').textContent          = S.week;
    updateWeekArrows();
    ridLoad();
    // No Load button: the week loads on arrival, and Refresh only re-reads scores.
    loadMatchups();
  } catch (e) {
    statusEl.className  = 'setup-status err';
    statusEl.textContent = e.message || 'Failed to load leagues';
  } finally {
    btn.disabled = false;
  }
}

// ── Prefs ─────────────────────────────────────────────────────────────────────
async function loadPrefs() {
  const stored = await loadStoredLeaguePrefs(S.auth);
  S.prefs = {};
  for (const lg of S.leagues) {
    S.prefs[lg.league_id] = stored[lg.league_id] ?? { value: 0, contender: true };
  }
}

// ── Week Controls ─────────────────────────────────────────────────────────────
function changeWeek(delta) {
  const w = Math.max(1, Math.min(18, S.week + delta));
  if (w === S.week) return;
  S.week = w;
  document.getElementById('week-num').textContent = S.week;
  updateWeekArrows();
  loadMatchups();
}

function updateWeekArrows() {
  document.getElementById('week-prev').disabled = S.week <= 1;
  document.getElementById('week-next').disabled = S.week >= 18;
}

// ── Load Matchups ─────────────────────────────────────────────────────────────
// The full load: player map, projections, schedule, every league's matchup. Runs
// by itself when the page opens and when the week changes — there's no Load
// button. After that, Refresh (refreshScores) re-reads only what moves in a game.
async function loadMatchups() {
  const seq = ++S.loadSeq;
  S.refreshing = false;
  S.loadedWeek = null;
  rfmBarDraw('Loading…');

  const container = document.getElementById('mnm-container');
  document.getElementById('mnm-section').style.display = '';
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Fetching matchup data…</div>';
  const week = S.week;

  try {
    // Players must load before matchups so ESPN name lookup can resolve Sleeper IDs
    // Week stats + projections only feed the Monday Night Miracle; a failure
    // there degrades that section, never the rest of the page.
    const [players, nflGames, stats, proj] = await Promise.all([
      fetch(`${API}/players`).then(r => r.json()),
      fetch(`${API}/espn/games?week=${week}&season=${S.season}`).then(r => r.ok ? r.json() : []),
      fetch(`${API}/sleeper/stats/nfl/regular/${S.season}/${week}`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(`${API}/sleeper/projections/nfl/regular/${S.season}/${week}`).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    if (seq !== S.loadSeq) return;   // the week changed while this ran
    S.playerMap = players || {};
    S.nflGames  = nflGames || [];
    S.mnmStats  = stats || {};
    S.mnmProj   = proj;

    // Contending leagues only — every section here is about them. (Every league's
    // matchup, rebuilders included, is the Scoreboard's job: /scoreboard.)
    S.espnSkips = [];
    const { results } = await fetchMatchupsFor(rfmContending(), week);
    if (seq !== S.loadSeq) return;
    S.matchupResults = results;
    S.loadedWeek     = week;
    S.at             = Date.now();

    try { renderMiracle(); }
    catch (e) {
      const box = document.getElementById('mnm-container');
      if (box) box.innerHTML = `<div class="err-state">Monday Night Miracle failed: ${esc(e.message)}</div>`;
    }
  } catch (e) {
    if (seq === S.loadSeq) container.innerHTML = `<div class="err-state">Failed to load matchup data: ${esc(e.message)}</div>`;
  } finally {
    if (seq === S.loadSeq) rfmBarDraw();
  }
}

// Refresh: scores, game clocks, and (when the Miracle is showing) the week's stat
// lines — nothing else. Everything on screen is redrawn IN PLACE: open game cards,
// the open player detail and collapsed position groups all survive, so a refresh never reads as a reload.
async function refreshScores() {
  if (S.refreshing || S.loadedWeek == null) return;
  const seq = ++S.loadSeq;
  const week = S.loadedWeek;
  S.refreshing = true;
  rfmBarDraw();
  const mnmShown = document.getElementById('mnm-section')?.style.display !== 'none';
  try {
    S.espnSkips = [];
    const [games, results, stats] = await Promise.all([
      fetch(`${API}/espn/games?week=${week}&season=${S.season}`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetchMatchupsFor(rfmContending(), week, true).then(x => x.results),
      mnmShown
        ? fetch(`${API}/sleeper/stats/nfl/regular/${S.season}/${week}`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)
        : null,
    ]);
    if (seq !== S.loadSeq) return;   // a week change started while this ran
    if (games?.length) S.nflGames = games;
    if (stats) S.mnmStats = stats;
    // A whole-page outage shouldn't wipe what's on screen; keep the last good read.
    if (!results.length && S.matchupResults.length) return;
    S.matchupResults = results;
    S.at = Date.now();

    try { renderMiracle(); } catch {}
  } finally {
    if (seq === S.loadSeq) {
      S.refreshing = false;
      rfmBarDraw();
    }
  }
}

const rfmContending = () => S.leagues.filter(lg => S.prefs[lg.league_id]?.contender);

function rfmBarDraw(busy) {
  const btn = document.getElementById('load-btn');
  const at = document.getElementById('week-at');
  if (btn) {
    btn.disabled = !!busy || S.refreshing || S.loadedWeek == null;
    btn.textContent = busy || (S.refreshing ? 'Refreshing…' : '↻ Refresh');
  }
  if (at) at.textContent = S.at && S.loadedWeek != null
    ? `as of ${new Date(S.at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}` : '';
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
// Only while an NFL game this week is actually in progress, and only while the tab
// is visible — a background tab polling ~70 leagues all Sunday helps nobody.
function rfmGamesLive() {
  const now = Date.now();
  return S.nflGames.some(g => g.state === 'in'
    || (g.state !== 'post' && new Date(g.kickoff).getTime() <= now && now - new Date(g.kickoff).getTime() < 5 * 3600e3));
}
function rfmAutoOn() {
  try { return localStorage.getItem('rfm_auto_refresh') !== '0'; } catch { return true; }
}
function setAutoRefresh(on) {
  try { localStorage.setItem('rfm_auto_refresh', on ? '1' : '0'); } catch {}
}
function rfmAutoTick() {
  if (!rfmAutoOn() || document.visibilityState !== 'visible') return;
  if (S.refreshing || S.loadedWeek == null || !rfmGamesLive()) return;
  if (S.at && Date.now() - S.at < RFM_AUTO_MS - 5000) return;
  refreshScores();
}
setInterval(rfmAutoTick, 15000);
// Coming back to the tab mid-game catches up straight away.
document.addEventListener('visibilitychange', rfmAutoTick);
document.getElementById('auto-refresh').checked = rfmAutoOn();

// ── Monday Night Miracle ──────────────────────────────────────────────────────
// What each still-live contending matchup needs from the players left to play,
// and which box scores for those games win the most $. The engine is
// /miracle.js; this is only plumbing + rendering. Best ball is left out: its
// score is an optimal lineup re-picked after the fact, not a sum of starters.
// Prepared on every Load, but only SIMULATED once the section is open: it opens
// itself on Monday (Eastern) or once a Monday game is under way, and stays a
// collapsed one-liner the rest of the week.
function renderMiracle() {
  const section = document.getElementById('mnm-section');
  const box     = document.getElementById('mnm-container');
  const details = document.getElementById('mnm-details');
  const info    = document.getElementById('mnm-summary-info');
  if (!section || !box) return;
  S.mnmToken++;
  S.mnmCtx = S.mnmRes = null;
  S.mnmRan = false;
  section.style.display = '';

  // Check every engine export this page calls, not just one: /miracle.js is
  // cached for hours, so an older copy can be missing newer functions.
  const MNM_NEEDS = ['mnmBuild', 'mnmRun', 'mnmIsMonday', 'mnmWindows', 'mnmRowWindow',
                     'mnmTradeoff', 'mnmFmtLine', 'mnmGameLabel', 'mnmRemainingFrac'];
  if (MNM_NEEDS.some(f => typeof window[f] !== 'function')) {
    box.innerHTML = '<div class="err-state">The Miracle engine (/miracle.js) didn\'t load — refresh in a minute.</div>';
    return;
  }
  const monday = S.nflGames.filter(g => mnmIsMonday(g));
  if (!monday.length) {   // e.g. Week 18
    if (info) info.textContent = '';
    box.innerHTML = `<div class="mnm-card"><div class="mnm-need">No Monday night game in Week ${S.week}.</div></div>`;
    return;
  }
  if (!S.mnmProj) {
    box.innerHTML = `<div class="err-state">Couldn't load Week ${S.week} projections, which the Monday numbers run on.</div>`;
    return;
  }

  let bestBall = 0;
  const matchups = [];
  for (const r of S.matchupResults) {
    if (r.league.settings?.best_ball === 1) { bestBall++; continue; }
    const side = m => m && {
      total: typeof m.points === 'number' ? m.points
        : (m.starters || []).reduce((t, pid) => t + (m.players_points?.[pid] || 0), 0),
      starters: m.starters || [], pts: m.players_points || {},
    };
    matchups.push({
      id: r.league.league_id, name: r.league.name || 'League',
      value: +(S.prefs[r.league.league_id]?.value) || 0,
      scoring: r.scoring || r.league.scoring_settings || {}, isEspn: r.league.source === 'espn',
      my: side(r.myMatchup), opp: side(r.oppMatchup),
    });
  }
  const ctx = mnmBuild({ matchups, games: S.nflGames, players: S.playerMap, proj: S.mnmProj, stats: S.mnmStats });
  S.mnmCtx = ctx;
  S.mnmBestBall = bestBall;

  const label = monday.map(g => `${g.away} @ ${g.home}`).join(', ');
  if (info) info.textContent = ctx.live.length
    ? `${label} · ${ctx.live.length} matchup${ctx.live.length !== 1 ? 's' : ''} ride on it`
    : `${label} · nothing riding on it`;

  const now = Date.now();
  const isMondayET = new Date(now).toLocaleDateString('en-US', { weekday: 'short', timeZone: 'America/New_York' }) === 'Mon';
  const underway = monday.some(g => mnmRemainingFrac(g, now) < 1);
  // Once per week, so a Refresh never re-opens a Miracle you closed.
  if (details && (isMondayET || underway) && S.mnmAutoWeek !== S.loadedWeek) {
    S.mnmAutoWeek = S.loadedWeek;
    details.open = true;   // fires ontoggle → run
  }
  if (details?.open) mnmRunAndDraw();
  else box.innerHTML = '';
}

function mnmOnToggle() {
  if (document.getElementById('mnm-details')?.open && S.mnmCtx && !S.mnmRan) mnmRunAndDraw();
}

async function mnmRunAndDraw() {
  const ctx = S.mnmCtx, box = document.getElementById('mnm-container');
  if (!ctx || S.mnmRan) return;
  S.mnmRan = true;
  const token = S.mnmToken;
  const notes = mnmNotesHtml(ctx, S.mnmBestBall || 0);

  if (!ctx.live.length) {
    const left = ctx.mondayGames.some(g => g.f > 0);
    box.innerHTML = `<div class="mnm-card"><div class="mnm-need">${left
      ? 'None of your contending matchups has a Monday-night starter still to play — nothing to root for tonight.'
      : 'Monday night is in the books.'}</div>${mnmDecidedHtml(ctx)}${notes}</div>`;
    return;
  }

  box.innerHTML = `<div class="mnm-card"><div class="loading-state"><div class="spinner"></div>
    <span id="mnm-prog">Simulating ${ctx.sims.toLocaleString()} versions of Monday night…</span></div></div>`;
  const res = await mnmRun(ctx, f => {
    const el = document.getElementById('mnm-prog');
    if (el && token === S.mnmToken) el.textContent = `Simulating… ${Math.round(f * 100)}%`;
  });
  if (token !== S.mnmToken) return;   // a newer Load started while this ran
  S.mnmRes = res;
  box.innerHTML = mnmHeroHtml(ctx, res) + mnmWindowsHtml(ctx) + mnmMatchupsHtml(ctx)
    + mnmLeverageHtml(ctx, res) + `<div class="mnm-card" style="padding:10px 16px">${mnmDecidedHtml(ctx)}${notes}</div>`;
}

const mnmMoney = (ctx, v, signed) => {
  const sign = signed && v > 0 ? '+' : signed && v < 0 ? '−' : '';
  const a = Math.abs(v);
  const n = a >= 100 || Number.isInteger(a) ? Math.round(a).toLocaleString() : a.toFixed(1);
  return ctx.unit === '$' ? `${sign}$${n}` : `${sign}${n} W`;
};
const mnmPct = p => p >= 0.995 ? '>99%' : p > 0 && p < 0.005 ? '<1%' : `${Math.round(p * 100)}%`;
function mnmName(pid) {
  const p = S.playerMap[pid];
  if (p?.position === 'DEF') return `${pid} D/ST`;
  return p?.full_name || `${p?.first_name || ''} ${p?.last_name || ''}`.trim() || pid;
}
const mnmPos = pid => (S.playerMap[pid]?.position || '').toUpperCase();

function mnmHeroHtml(ctx, res) {
  const games = ctx.relGames.map(g =>
    `<span class="mnm-game"><b>${esc(g.away)} @ ${esc(g.home)}</b> · ${esc(mnmGameLabel(g))}</span>`).join('');
  const tile = (v, l, sub) => `<div class="mnm-tile"><div class="mnm-tile-v">${v}</div><div class="mnm-tile-l">${l}</div>${sub ? `<div class="mnm-tile-s">${sub}</div>` : ''}</div>`;
  const best = res.tiers[0];
  return `<div class="mnm-card">
    <div class="mnm-label">Monday night</div>
    <div class="mnm-games">${games}</div>
    <div class="mnm-tiles">
      ${tile(mnmMoney(ctx, res.atStake), 'At stake', `${ctx.live.length} live matchup${ctx.live.length !== 1 ? 's' : ''}`)}
      ${tile(mnmMoney(ctx, res.expected), 'Expected', `middle 80%: ${mnmMoney(ctx, res.p10)}–${mnmMoney(ctx, res.p90)}`)}
      ${tile(mnmMoney(ctx, best.usd), 'Best case', `${mnmPct(best.count / ctx.sims)} of sims`)}
      ${tile(mnmPct(res.sweepP), 'Clean sweep', res.sweepP ? 'win every live matchup' : 'never happened — see below')}
    </div>
  </div>`;
}

// Leverage = E[$ | he beats his median] − E[$ | he doesn't]. The Root For Me
// score says whose side he's on; this says how much his night is worth.
function mnmLeverageHtml(ctx, res) {
  const nameOf = id => esc(ctx.live.find(r => r.id === id)?.name || id);
  const max = Math.max(1e-9, ...res.leverage.map(l => Math.abs(l.lev)));
  const rows = res.leverage.map(l => {
    const pos = mnmPos(l.pid);
    const score = Math.round(50 + 50 * l.lev / max);
    const sub = [
      l.mine.length ? `<span class="mnm-good">yours in</span> ${l.mine.map(nameOf).join(', ')}` : '',
      l.theirs.length ? `<span class="mnm-bad">theirs in</span> ${l.theirs.map(nameOf).join(', ')}` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="mnm-lev-row pos-${pos.toLowerCase()}">
      <span class="player-pos">${pos || '—'}</span>
      <div style="min-width:0"><div class="mnm-lev-name">${esc(mnmName(l.pid))}</div><div class="mnm-lev-sub">${sub}</div></div>
      <span class="mnm-lev-range" title="Middle 80% of his simulated nights, full-PPR points">${l.p10.toFixed(0)}–${l.p90.toFixed(0)} pts</span>
      <span class="mnm-chip" style="background:${rootColor(score)}" title="Expected ${ctx.unit === '$' ? '$' : 'wins'} when he beats his median night vs. when he doesn't">${mnmMoney(ctx, l.lev, true)}</span>
    </div>`;
  }).join('');
  return `<div class="mnm-card"><div class="mnm-label">Who to root for — what a big night is worth</div>${rows}
    <div class="mnm-note">The chip is how much more you win, on average, when he beats his median night than when he doesn't. Negative = root against.</div></div>`;
}

function mnmMatchupsHtml(ctx) {
  const rows = [...ctx.live].sort((a, b) => b.weight - a.weight || Math.abs(a.gap) - Math.abs(b.gap)).map(row => {
    const chip = (pid, cls) => `<span class="${cls}">${esc(mnmName(pid))} · ${((cls === 'mine' ? row.my : row.opp).pts[pid] || 0).toFixed(1)}</span>`;
    return `<div class="mnm-mu">
      <div class="mnm-mu-head">
        <span class="mnm-mu-name">${esc(row.name)}${row.isEspn ? ' <span class="player-count">ESPN</span>' : ''}</span>
        ${ctx.unit === '$' ? `<span class="mnm-mu-val">${mnmMoney(ctx, row.weight)}</span>` : ''}
        <span class="mnm-mu-score">${row.my.now.toFixed(1)} – ${row.opp.now.toFixed(1)}</span>
        <span class="mnm-chip" style="background:${rootColor(Math.round(row.winP * 100))}">${mnmPct(row.winP)}</span>
      </div>
      <div class="mnm-bar"><span style="width:${(row.winP * 100).toFixed(1)}%"></span></div>
      <div class="mnm-need">${mnmNeedHtml(ctx, row)}</div>
      <div class="mnm-rem">${row.my.rem.map(p => chip(p, 'mine')).join('')}${row.opp.rem.map(p => chip(p, 'theirs')).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="mnm-card"><div class="mnm-label">What each matchup needs</div>${rows}</div>`;
}

function mnmNeedHtml(ctx, row) {
  const gap = row.gap, my = row.my.rem, op = row.opp.rem;
  const names = a => a.map(p => `<b>${esc(mnmName(p))}</b>`).join(' + ');
  const n = x => Math.abs(x).toFixed(1);
  let h;
  if (my.length && !op.length) {
    h = gap > 0 ? `Up ${n(gap)} and their side is done.` : `${names(my)} need${my.length === 1 ? 's' : ''} <b>${n(gap)}+</b> more.`;
  } else if (!my.length && op.length) {
    h = gap <= 0 ? `Down ${n(gap)} with nobody left — only a negative night from ${names(op)} saves it.`
      : `Up ${n(gap)}. Hold ${names(op)} under <b>${n(gap)}</b> more.`;
  } else {
    h = gap >= 0
      ? `Up ${n(gap)}. ${names(op)} can outscore ${names(my)} by up to <b>${n(gap)}</b> the rest of the way.`
      : `${names(my)} must outscore ${names(op)} by <b>${n(gap)}+</b> the rest of the way.`;
  }
  const inRow = [...my, ...op];
  // 2+ Monday players: one combined answer — step the biggest one's night and
  // solve the rest against it.
  const tr = inRow.length > 1 ? mnmTradeoff(ctx, row.id) : null;
  if (tr) return h + mnmTradeoffHtml(ctx, tr);
  // A lone Monday player: his window for this matchup.
  return h + inRow.map(pid => {
    const w = mnmRowWindow(ctx, row.id, pid);
    if (!w) return '';
    const range = mnmRangeHtml(w, 2);
    const body = range || `<span class="mnm-opt">${w.max > 0 ? 'safe whatever he does' : "can't swing it on his own"}</span>`;
    return `<div class="mnm-need-p"><span class="${my.includes(pid) ? 'mnm-good' : 'mnm-bad'}">${esc(mnmName(pid))}</span> — ${body}</div>`;
  }).join('');
}

// "If <pivot> goes … → <each other> needs …". Rows are the pivot's full-game
// line (what he has + the rest at that pace); each cell is the other player's
// window with the pivot pinned there and anyone else at projection.
function mnmTradeoffHtml(ctx, tr) {
  const pPos = mnmPos(tr.pivot);
  const head = `<tr><th>If ${esc(mnmName(tr.pivot))} goes…</th>${tr.others.map(q =>
    `<th class="${tr.row.my.rem.includes(q) ? 'mnm-good' : 'mnm-bad'}">${esc(mnmName(q))}${tr.row.my.rem.includes(q) ? ' needs' : ' must stay'}</th>`).join('')}</tr>`;
  const body = tr.steps.map(st => `<tr>
      <td><b>${esc(mnmFmtLine(st.line, pPos))}</b><span class="mnm-tr-tag">${esc(st.label)}</span></td>
      ${st.cells.map(c => `<td>${mnmCellHtml(c.w, tr.row.my.rem.includes(c.pid))}</td>`).join('')}
    </tr>`).join('');
  const linked = tr.linked;
  const note = linked.length
    ? `<div class="mnm-opt">${linked.map(q => esc(mnmName(q))).join(', ')} share${linked.length === 1 ? 's' : ''} an offence with ${esc(mnmName(tr.pivot))} — his yards and TDs count for both.</div>` : '';
  return `<div class="mnm-tr-wrap"><table class="mnm-tr">${head}${body}</table></div>${note}`;
}

// One window as a single cell: its most realistic TD-count row.
function mnmCellHtml(w, mine) {
  if (!w) return '—';
  if (w.flat) return w.max > 0 ? '<span class="mnm-good">anything</span>'
    : `<span class="mnm-bad">${mine ? "can't save it" : 'even a zero isn\'t enough'}</span>`;
  if (w.flatPts) {
    const p = e => `${e.ref.toFixed(1)} pts`;
    return w.floor ? `under <b>${p(w.high)}</b>` : w.unbounded ? `<b>${p(w.low)}</b>+` : `<b>${p(w.low)}</b> – <b>${p(w.high)}</b>`;
  }
  const r = mnmRangeRows(w, 1)[0];
  return r ? `<span class="mnm-tr-td">${r.label}</span> ${r.html}` : '—';
}

// A window as text: per TD count, the range of his full-game line that wins
// the most. `maxRows` trims it for the compact per-matchup view.
function mnmRangeHtml(w, maxRows) {
  const pts = e => `${e.ref.toFixed(1)} pts`;
  if (w.flat) return null;
  if (w.flatPts) {
    return w.floor && w.unbounded ? 'anything works'
      : w.floor ? `keep him under <b>${pts(w.high)}</b>`
      : w.unbounded ? `<b>${pts(w.low)}</b> or more`
      : `between <b>${pts(w.low)}</b> and <b>${pts(w.high)}</b>`;
  }
  const head = w.floor && w.unbounded ? 'anything works' : w.floor ? 'keep him under' : w.unbounded ? 'needs' : 'sweet spot';
  const lines = mnmRangeRows(w, maxRows)
    .map(r => `<div class="mnm-win-k"><span>${r.label}</span>${r.html}</div>`).join('');
  const tdNote = w.floor && !w.byK.some(r => r.k > 0) ? '<div class="mnm-opt">Any touchdown sinks it.</div>' : '';
  return `${head}${lines}${tdNote}`;
}

// The window's per-TD-count rows as {label, html}. TD counts include what he
// already has — a player with 1 TD in hand starts at "1 TD", never "no TD".
// Rows past 2× his projected volume are a wish, not a target — shown only
// when nothing more realistic gets there.
function mnmRangeRows(w, maxRows) {
  const pos = mnmPos(w.pid);
  const tdKeys = pos === 'QB' ? ['pass_td'] : ['rec_td', 'rush_td'];
  const bare = e => esc(mnmFmtLine({ ...e.line, ...Object.fromEntries(tdKeys.map(k => [k, 0])) }, pos));
  const curTd = tdKeys.reduce((t, k) => t + (S.mnmStats?.[w.pid]?.[k] || 0), 0);
  const real = w.byK.filter(r => r.fromZero || r.lo.t <= MNM_T_REASONABLE);
  const show = (real.length ? real : w.byK.slice(0, 1)).slice(0, maxRows);
  const rng = r => r.fromZero && r.toCap ? 'any line'
    : r.fromZero ? `up to <b>${bare(r.hi)}</b>`
    : r.toCap ? `<b>${bare(r.lo)}</b> or more`
    : `<b>${bare(r.lo)}</b> → <b>${bare(r.hi)}</b>`;
  return show.map(r => { const n = r.k + curTd; return { label: n ? `${n} TD` : 'no TD', html: rng(r) }; });
}

// Teammates (and the other D/ST, his kicker) whose lines move with him.
function mnmMovesWithHtml(w, onlyIn) {
  const ids = w.linked.filter(q => !onlyIn || onlyIn.includes(q));
  return ids.length ? `<div class="mnm-opt">moves with him: ${ids.map(q => esc(mnmName(q))).join(', ')}</div>` : '';
}

// The actual numbers: per player, the range of his line that wins the most $
// across every league it touches (mnmWindows). Below the window a league he
// helps slips; above it, one he hurts does.
function mnmWindowsHtml(ctx) {
  const wins = mnmWindows(ctx);
  const names = rows => rows.map(r => esc(r.name)).join(', ');
  const rowsHtml = wins.map(w => {
    const pos = mnmPos(w.pid);
    const range = mnmRangeHtml(w, 3);
    const what = range ? range.replace(/^\w/, c => c.toUpperCase())
      : '<span class="mnm-opt">Doesn\'t swing anything if everyone else hits projection.</span>';
    const sub = w.flat ? '' : [
      w.wonAtBest.length ? `<span class="mnm-good">wins</span> ${names(w.wonAtBest)} (${mnmMoney(ctx, w.max)})` : `best case ${mnmMoney(ctx, w.max)}`,
      w.lostBelow.length ? `less loses ${names(w.lostBelow)}` : '',
      w.lostAbove.length ? `<span class="mnm-bad">more loses</span> ${names(w.lostAbove)}` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="mnm-win pos-${pos.toLowerCase()}">
      <span class="player-pos">${pos || '—'}</span>
      <div style="min-width:0"><div class="mnm-lev-name">${esc(mnmName(w.pid))}</div>
        <div class="mnm-need">${what}</div>${sub ? `<div class="mnm-lev-sub">${sub}</div>` : ''}${w.flat ? '' : mnmMovesWithHtml(w)}</div>
      ${w.flat ? '' : `<span class="mnm-chip" style="background:${rootColor(100)}" title="Swing between his best and worst window">${mnmMoney(ctx, w.swing)}</span>`}
    </div>`;
  }).join('');
  return `<div class="mnm-card"><div class="mnm-label">Optimal stat lines — the numbers you need</div>${rowsHtml}
    <div class="mnm-note">Full-game lines (what he has + the rest of the game), scored in each of his matchups with everyone else in it at projection — except a teammate in the same matchup, whose line moves with his (a Lamb TD is a Dak TD). The chip is how much $ his night swings.</div></div>`;
}

function mnmDecidedHtml(ctx) {
  const done = ctx.rows.filter(r => r.decided && r.opp);
  if (!done.length) return '';
  const won = done.filter(r => r.gap > 0), lost = done.filter(r => r.gap < 0);
  const list = a => a.map(r => esc(r.name)).join(', ');
  return `<div class="mnm-note" style="font-style:normal">Already settled:
    ${won.length ? `<span class="mnm-good">${won.length} won${ctx.unit === '$' ? ` (${mnmMoney(ctx, ctx.decidedWon)})` : ''}</span> — ${list(won)}` : ''}
    ${won.length && lost.length ? ' · ' : ''}
    ${lost.length ? `<span class="mnm-bad">${lost.length} lost${ctx.unit === '$' ? ` (${mnmMoney(ctx, ctx.decidedLost)})` : ''}</span> — ${list(lost)}` : ''}</div>`;
}

function mnmNotesHtml(ctx, bestBall) {
  const bits = [`Win % and the chips come from ${ctx.sims.toLocaleString()} simulations of Monday night off Sleeper's Week ${S.week} projections; the stat lines are exact thresholds in each league's scoring, starting from what each player already has.`];
  if (ctx.rows.some(r => r.notMonday) || ctx.live.some(r => r.my.pend.length || r.opp.pend.length))
    bits.push('Starters still playing before Monday count at their current score + projection.');
  if (ctx.unit === 'W') bits.push('No $ values set on these leagues, so results count matchups won — set values in your profile (Contending).');
  if (bestBall) bits.push(`${bestBall} best ball league${bestBall !== 1 ? 's' : ''} left out (their score is an optimal lineup picked after the fact).`);
  if (ctx.live.some(r => r.isEspn)) bits.push('ESPN kickers and D/ST are priced with Sleeper\'s default scoring.');
  return `<div class="mnm-note">${bits.join(' ')}</div>`;
}

// ── Color ─────────────────────────────────────────────────────────────────────
function rootColor(score) {
  const hue = score < 50
    ? (score / 50) * 42
    : 42 + ((score - 50) / 50) * 78;
  return `hsl(${hue.toFixed(0)}, 68%, 35%)`;
}

// Enter key triggers username load
document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitUsername();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
