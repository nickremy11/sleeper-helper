<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auction Draft Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared-styles.css">
  <style>
    .auc-wrap { max-width: 1300px; margin: 0 auto; padding: 20px 16px 60px; }

    /* ── Setup card ── */
    .auc-setup {
      max-width: 620px; margin: 0 auto;
      background: var(--brown-dark); border: 1px solid var(--brown-mid);
      border-radius: 4px; padding: 28px 32px;
    }
    .auc-setup-title {
      font-family: 'Rye', serif; font-size: 0.85rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 22px;
    }
    .auc-field { margin-bottom: 18px; }
    .auc-label {
      display: block; font-family: 'Rye', serif; font-size: 0.46rem;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--brown-light); margin-bottom: 7px;
    }
    .auc-input, .auc-select {
      width: 100%; padding: 9px 12px; background: rgba(0,0,0,0.3);
      border: 1px solid var(--brown-mid); border-radius: 3px;
      color: var(--cream); font-family: 'Crimson Text', serif; font-size: 0.98rem;
      outline: none; box-sizing: border-box;
    }
    .auc-input:focus, .auc-select:focus { border-color: var(--gold); }
    .auc-select option { background: #1e0e05; }
    .auc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .auc-csv-drop {
      border: 2px dashed var(--brown-mid); border-radius: 4px;
      padding: 28px 20px; text-align: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .auc-csv-drop:hover, .auc-csv-drop.drag-over {
      border-color: var(--gold); background: rgba(201,150,42,0.05);
    }
    .auc-csv-drop-label {
      font-family: 'Crimson Text', serif; font-size: 1rem; color: var(--brown-light);
    }
    .auc-csv-drop-label span { color: var(--gold); cursor: pointer; text-decoration: underline; }
    .auc-csv-hint {
      font-family: 'Crimson Text', serif; font-size: 0.78rem;
      color: var(--brown-light); margin-top: 8px; font-style: italic;
    }
    .auc-import-summary {
      font-family: 'Crimson Text', serif; font-size: 0.9rem;
      color: var(--green-light); margin-top: 10px;
    }
    .auc-import-err { color: #e05252; }
    .auc-btn {
      font-family: 'Rye', serif; font-size: 0.5rem; letter-spacing: 0.16em;
      text-transform: uppercase; padding: 11px 28px;
      background: var(--gold); color: var(--brown-dark);
      border: none; border-radius: 3px; cursor: pointer;
      transition: background 0.15s; margin-top: 8px;
    }
    .auc-btn:hover { background: var(--gold-light); }
    .auc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .auc-btn-ghost {
      background: transparent; color: var(--brown-light);
      border: 1px solid var(--brown-mid); margin-left: 10px;
    }
    .auc-btn-ghost:hover { border-color: var(--gold); color: var(--gold); background: transparent; }
    .auc-resume-banner {
      background: rgba(201,150,42,0.1); border: 1px solid var(--gold);
      border-radius: 3px; padding: 12px 16px; margin-bottom: 20px;
      font-family: 'Crimson Text', serif; font-size: 0.92rem; color: var(--cream);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    /* ── Main layout ── */
    .auc-main { display: grid; grid-template-columns: 1fr 310px; gap: 16px; }
    @media (max-width: 860px) { .auc-main { grid-template-columns: 1fr; } }

    /* ── Stats bar ── */
    .auc-stats-bar {
      background: var(--brown-dark); border: 1px solid var(--brown-mid);
      border-radius: 4px; padding: 14px 18px; margin-bottom: 14px;
    }
    .auc-stats-row1 {
      display: flex; gap: 28px; align-items: center; flex-wrap: wrap;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
    }
    .auc-stat-item { text-align: center; }
    .auc-stat-val {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: 1.3rem; color: var(--gold);
    }
    .auc-stat-val.inflation-low  { color: var(--green-light); }
    .auc-stat-val.inflation-high { color: #e05252; }
    .auc-stat-label {
      font-family: 'Rye', serif; font-size: 0.38rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--brown-light); margin-top: 2px;
    }
    .auc-stats-row2 { display: flex; gap: 10px; flex-wrap: wrap; }
    .auc-pos-tile {
      background: rgba(0,0,0,0.2); border: 1px solid var(--brown-mid);
      border-radius: 3px; padding: 8px 12px; min-width: 200px; flex: 1;
    }
    .auc-pos-tile-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .auc-pos-tile-pct {
      font-family: 'Crimson Text', serif; font-size: 0.78rem;
      color: var(--brown-light); margin-left: auto;
    }
    .auc-pos-tile-bar {
      height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px;
      margin-bottom: 7px; overflow: hidden;
    }
    .auc-pos-tile-bar-fill { height: 100%; border-radius: 2px; opacity: 0.7; }
    .auc-pos-tile-players { display: flex; flex-direction: column; gap: 2px; }
    .auc-pos-player {
      font-family: 'Crimson Text', serif; font-size: 0.82rem; color: var(--parchment);
      display: flex; justify-content: space-between; gap: 6px;
    }
    .auc-pos-player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .auc-pos-player-val { color: var(--gold); flex-shrink: 0; font-weight: 600; }

    /* ── Player pool ── */
    .auc-pool {
      background: var(--brown-dark); border: 1px solid var(--brown-mid);
      border-radius: 4px; overflow: hidden;
    }
    .auc-pool-controls {
      padding: 12px 14px; border-bottom: 1px solid var(--brown-mid);
      display: flex; flex-direction: column; gap: 9px;
    }
    .auc-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .auc-pill {
      font-family: 'Rye', serif; font-size: 0.4rem; letter-spacing: 0.14em;
      text-transform: uppercase; padding: 5px 11px;
      border: 1.5px solid var(--brown-mid); border-radius: 2px;
      background: transparent; color: var(--brown-light);
      cursor: pointer; transition: all 0.12s;
    }
    .auc-pill:hover { border-color: var(--gold); color: var(--gold); }
    .auc-pill.active {
      border-color: var(--gold); color: var(--brown-dark);
      background: var(--gold);
    }
    .auc-pool-controls-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .auc-search {
      flex: 1; min-width: 120px; padding: 7px 10px;
      background: rgba(0,0,0,0.25); border: 1px solid var(--brown-mid);
      border-radius: 3px; color: var(--cream);
      font-family: 'Crimson Text', serif; font-size: 0.92rem; outline: none;
    }
    .auc-search:focus { border-color: var(--gold); }
    .auc-search::placeholder { color: var(--brown-light); }
    .auc-team-filter {
      padding: 7px 10px; background: rgba(0,0,0,0.25);
      border: 1px solid var(--brown-mid); border-radius: 3px;
      color: var(--cream); font-family: 'Crimson Text', serif;
      font-size: 0.9rem; outline: none;
    }
    .auc-team-filter:focus { border-color: var(--gold); }
    .auc-team-filter option { background: #1e0e05; }
    .auc-show-drafted {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Crimson Text', serif; font-size: 0.86rem;
      color: var(--brown-light); cursor: pointer; white-space: nowrap;
    }
    .auc-show-drafted input { cursor: pointer; accent-color: var(--gold); }

    /* ── Pool table ── */
    .auc-pool-table { width: 100%; border-collapse: collapse; }
    .auc-pool-table thead tr {
      background: #1e0e05;
    }
    .auc-pool-table th {
      font-family: 'Rye', serif; font-size: 0.38rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--gold); padding: 8px 10px;
      text-align: left; white-space: nowrap; border-bottom: 1px solid var(--brown-mid);
    }
    .auc-pool-table th.sortable { cursor: pointer; user-select: none; }
    .auc-pool-table th.sortable:hover { color: var(--gold-light); }
    .auc-pool-table th.sort-active { color: var(--gold-light); }
    .auc-pool-table th.num, .auc-pool-table td.num { text-align: right; }
    .auc-pool-table tbody tr {
      border-bottom: 1px dashed rgba(255,255,255,0.04);
      transition: background 0.1s; cursor: pointer;
    }
    .auc-pool-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .auc-pool-table tbody tr.drafted {
      opacity: 0.45; cursor: default;
    }
    .auc-pool-table tbody tr.drafted td { text-decoration: line-through; }
    .auc-pool-table tbody tr.drafted td.no-strike { text-decoration: none; }
    .auc-pool-table td {
      font-family: 'Crimson Text', serif; font-size: 0.9rem;
      color: var(--parchment); padding: 7px 10px;
    }
    .auc-pool-table td.val-my { color: var(--gold); font-weight: 600; }
    .auc-pool-table td.val-inf { color: var(--green-light); font-weight: 600; }
    .auc-pool-table td.val-espn { color: var(--brown-light); }
    .auc-pool-table td.status-cell {
      font-size: 0.8rem; color: var(--brown-light); text-decoration: none !important;
    }
    .auc-pool-table td.status-cell .drafted-tag {
      color: var(--parchment); font-style: italic;
    }
    .auc-pool-empty {
      padding: 28px 16px; text-align: center;
      font-family: 'Crimson Text', serif; font-size: 0.92rem;
      color: var(--brown-light); font-style: italic;
    }
    .auc-undo-btn {
      background: none; border: none; cursor: pointer;
      color: var(--brown-light); font-size: 0.78rem; padding: 0 4px;
      line-height: 1; vertical-align: middle;
      text-decoration: none !important;
    }
    .auc-undo-btn:hover { color: #e05252; }

    /* ── Position badges ── */
    .auc-pos {
      display: inline-block; font-family: 'Crimson Text', serif; font-weight: 700;
      font-size: 0.76rem; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 2px; min-width: 30px; text-align: center;
    }
    .auc-pos-QB { background: rgba(224,82,82,0.18);  color: #e05252; }
    .auc-pos-RB { background: rgba(92,184,92,0.18);  color: #5cb85c; }
    .auc-pos-WR { background: rgba(91,192,222,0.18); color: #5bc0de; }
    .auc-pos-TE { background: rgba(232,115,75,0.18); color: #e8734b; }
    .auc-pos-K  { background: rgba(210,205,195,0.1); color: #a8a49e; }
    .auc-pos-DST { background: rgba(155,89,182,0.18); color: #9b59b6; }

    /* ── Sort indicator ── */
    .sort-arrow { margin-left: 4px; }

    /* ── Teams panel ── */
    .auc-teams {
      background: var(--brown-dark); border: 1px solid var(--brown-mid);
      border-radius: 4px; overflow: hidden; display: flex; flex-direction: column;
    }
    .auc-teams-header {
      padding: 10px 14px; background: #1e0e05;
      border-bottom: 1px solid var(--brown-mid);
      font-family: 'Rye', serif; font-size: 0.5rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold);
      display: flex; align-items: center; justify-content: space-between;
    }
    .auc-teams-list { overflow-y: visible; }
    .auc-team-card {
      border-bottom: 1px dashed rgba(255,255,255,0.06); padding: 10px 14px;
    }
    .auc-team-card:last-child { border-bottom: none; }
    .auc-team-name-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 5px;
    }
    .auc-team-name {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: 0.88rem; color: var(--cream);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .auc-team-budget {
      font-family: 'Crimson Text', serif; font-size: 0.82rem;
      color: var(--brown-light); flex-shrink: 0; margin-left: 8px;
    }
    .auc-team-budget span { color: var(--gold); font-weight: 600; }
    .auc-budget-bar {
      height: 4px; background: rgba(255,255,255,0.08);
      border-radius: 2px; margin-bottom: 6px; overflow: hidden;
    }
    .auc-budget-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .auc-team-needs {
      font-family: 'Crimson Text', serif; font-size: 0.76rem;
      color: var(--brown-light); margin-bottom: 5px;
    }
    .auc-team-needs span { color: var(--parchment); }
    .auc-team-roster { display: flex; flex-direction: column; gap: 2px; }
    .auc-team-player {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Crimson Text', serif; font-size: 0.8rem; color: var(--parchment);
    }
    .auc-team-player-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .auc-team-player-price { color: var(--gold); font-weight: 600; flex-shrink: 0; }
    .auc-team-player-keeper {
      font-size: 0.68rem; color: var(--brown-light); font-style: italic; flex-shrink: 0;
    }
    .auc-team-card details summary { cursor: pointer; list-style: none; }
    .auc-team-card details summary::-webkit-details-marker { display: none; }
    .auc-roster-toggle {
      font-family: 'Crimson Text', serif; font-size: 0.76rem;
      color: var(--brown-light); margin-top: 4px; display: inline-block;
    }
    .auc-roster-toggle:hover { color: var(--gold); }
    .auc-add-team-btn {
      margin: 10px 14px;
      font-family: 'Crimson Text', serif; font-size: 0.86rem;
      color: var(--brown-light); background: none; border: 1px dashed var(--brown-mid);
      border-radius: 3px; padding: 7px 14px; cursor: pointer; width: calc(100% - 28px);
      transition: all 0.12s;
    }
    .auc-add-team-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Tier shading ── */
    .auc-pool-table tbody tr.tier-odd  { background: rgba(201,150,42,0.07); }
    .auc-pool-table tbody tr.tier-even { background: rgba(91,192,222,0.05); }
    .auc-pool-table tbody tr.tier-odd:hover  { background: rgba(201,150,42,0.13); }
    .auc-pool-table tbody tr.tier-even:hover { background: rgba(91,192,222,0.10); }
    .auc-tier-badge {
      display: inline-block; font-family: 'Rye', serif; font-size: 0.34rem;
      letter-spacing: 0.08em; padding: 1px 4px; border-radius: 2px;
      vertical-align: middle; margin-left: 5px; opacity: 0.65;
    }
    .auc-tier-badge-odd  { background: rgba(201,150,42,0.18); color: var(--gold); }
    .auc-tier-badge-even { background: rgba(91,192,222,0.15); color: #5bc0de; }

    /* ── Player notes (target / avoid / dart throw) ── */
    .auc-note-btns { display: flex; gap: 6px; margin-left: auto; }
    .auc-note-btn {
      font-family: 'Rye', serif; font-size: 0.42rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 6px 10px; border-radius: 3px;
      border: 1.5px solid transparent; cursor: pointer; opacity: 0.75;
      transition: opacity 0.12s;
    }
    .auc-note-btn:hover, .auc-note-btn.active { opacity: 1; }
    .auc-note-btn.active { border-color: var(--cream); }

    .auc-note-popover {
      margin-top: 10px; padding: 10px 12px;
      background: rgba(0,0,0,0.2); border: 1px solid var(--brown-mid); border-radius: 4px;
      position: relative;
    }
    .auc-notes-label {
      font-family: 'Rye', serif; font-size: 0.46rem; letter-spacing: 0.14em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 2px;
      display: inline-block; margin-bottom: 8px;
    }
    .auc-notes-search-wrap { position: relative; }
    .auc-note-input {
      width: 100%; padding: 7px 10px; background: rgba(0,0,0,0.2);
      border: 1px solid var(--brown-mid); border-radius: 3px;
      color: var(--cream); font-family: 'Crimson Text', serif; font-size: 0.88rem;
    }
    .auc-note-input:focus { border-color: var(--gold); }
    .auc-note-suggest {
      position: absolute; top: calc(100% + 3px); left: 0; right: 0; z-index: 50;
      background: #1e0e05; border: 1px solid var(--brown-mid); border-radius: 3px;
      max-height: 220px; overflow-y: auto;
    }
    .auc-note-suggest:empty { border: none; }
    .auc-note-suggest-item {
      padding: 6px 10px; font-family: 'Crimson Text', serif; font-size: 0.86rem;
      color: var(--cream); cursor: pointer;
    }
    .auc-note-suggest-item:hover { background: rgba(201,150,42,0.12); }
    .auc-note-suggest-meta { color: var(--brown-light); font-size: 0.78rem; margin-left: 4px; }
    .auc-note-suggest-empty {
      padding: 6px 10px; font-family: 'Crimson Text', serif; font-size: 0.82rem;
      font-style: italic; color: var(--brown-light);
    }

    /* Name highlight in the player pool table */
    .auc-name-pill { padding: 2px 7px; border-radius: 3px; font-weight: 600; cursor: pointer; }

    .auc-note-target, .auc-note-target-label { background: var(--gold); color: var(--brown-dark); }
    .auc-note-avoid,  .auc-note-avoid-label  { background: var(--red);  color: var(--cream); }
    .auc-note-dart,   .auc-note-dart-label  { background: #8fd3f4; color: #0d3b4f; }

    /* ── Modal ── */
    .auc-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      z-index: 500; display: flex; align-items: center; justify-content: center;
    }
    .auc-modal {
      background: var(--brown-dark); border: 1px solid var(--brown-mid);
      border-radius: 4px; padding: 28px 28px 22px; width: 340px; max-width: 90vw;
    }
    .auc-modal-title {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: 1.1rem; color: var(--cream); margin-bottom: 4px;
    }
    .auc-modal-sub {
      font-family: 'Crimson Text', serif; font-size: 0.82rem;
      color: var(--brown-light); margin-bottom: 20px;
    }
    .auc-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .auc-modal-err {
      font-family: 'Crimson Text', serif; font-size: 0.84rem;
      color: #e05252; margin-top: 6px; min-height: 18px;
    }

    /* ── Poll status ── */
    .auc-poll-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--brown-light); margin-right: 5px; vertical-align: middle;
    }
    .auc-poll-dot.live { background: var(--green-light); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .auc-poll-status {
      font-family: 'Crimson Text', serif; font-size: 0.8rem; color: var(--brown-light);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="banner">
      <div style="position:relative;z-index:1;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;">
        <div class="banner-text">
          <a href="/" class="banner-back">← Home</a>
          <h1>Auction <span>Draft Tracker</span></h1>
          <div class="banner-divider"></div>
        </div>
        <div id="auth-chip"></div>
      </div>
    </div>

    <div class="auc-wrap">
      <div id="app"></div>
    </div>
  </div>

  <!-- Mark as Drafted modal (rendered here, shown/hidden via JS) -->
  <div id="auc-modal" class="auc-modal-backdrop" style="display:none;" onclick="modalBackdropClick(event)">
    <div class="auc-modal" onclick="event.stopPropagation()">
      <div class="auc-modal-title" id="modal-player-name"></div>
      <div class="auc-modal-sub" id="modal-player-meta"></div>
      <div class="auc-field">
        <label class="auc-label">Team</label>
        <select id="modal-team" class="auc-select"></select>
      </div>
      <div class="auc-field">
        <label class="auc-label">Winning Bid ($)</label>
        <input id="modal-bid" class="auc-input" type="number" min="1" max="999" placeholder="e.g. 42">
      </div>
      <div class="auc-modal-err" id="modal-err"></div>
      <div class="auc-modal-actions">
        <button class="auc-btn" onclick="saveDraft()">Save Pick</button>
        <button class="auc-btn auc-btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/shared-utils.js"></script>
  <script src="/shared-auth.js"></script>
  <script>
  'use strict';

  const API = window.location.hostname === 'ffhistorian.com'
    ? 'https://helper.ffhistorian.com/api'
    : '/api';

  // ─── State ────────────────────────────────────────────────────────────────────

  const A = {
    leagueId: null,      // ESPN numeric league ID, Sleeper league ID, or null
    leagueName: '',
    source: null,        // 'espn' | 'sleeper' | null (manual/CSV)
    budget: 200,
    rosterSpots: 16,
    lineupReqs: null,     // {QB,RB,WR,TE,FLEX,K,DST} starter counts — null until Start Tracking; drives "Needs"
    teams: [],           // [{id, name, spent, draftedCount, players:[{name,pos,price,keeper}]}]
    players: [],         // [{name, pos, nflTeam, myVal, espnVal, drafted, price, teamId, keeper, _sleeperId}]
    posFilter: 'ALL',
    teamFilter: '',
    sortBy: 'inflated',  // 'my' | 'inflated' | 'espn'
    sortDir: -1,         // -1 = desc
    search: '',
    showDrafted: true,
    pollTimer: null,
    espnLeagues: [],     // [{id, name}] from settings
    sleeperLeagues: [],  // [{id, name}] from the user's Sleeper username
    sleeperDraftId: null,// the specific auction draft_id being polled
    _sleeperUsername: undefined, // undefined = fetch not yet run; null = no username on profile; string = looked up
    _sleeperFetchState: null,    // null | 'no-user' | 'error' | 'ok' — why sleeperLeagues came back empty, for the setup UI
    _sleeperPlayers: null, // Map<sleeperPlayerId, {name, pos, team}> — lazy-loaded, for pick resolution
    _modalPlayer: null,  // index into A.players
    _nameMap: null,      // Map<normalizedName, idx> for ESPN/Sleeper name matching
    _espnValNote: null,  // status string for the one-shot ESPN $ auto-fill
    _notePopoverOpen: null, // 'target' | 'avoid' | 'dart' | null — which note search box is open
  };

  // ─── Persistence ─────────────────────────────────────────────────────────────

  function saveKey() {
    // Sleeper gets its own namespace to avoid any theoretical collision with an
    // ESPN numeric league ID; ESPN/manual keep their original (pre-Sleeper) format
    // so existing saved drafts keep resolving.
    if (A.source === 'sleeper') return 'auction_sleeper_' + A.leagueId;
    return 'auction_' + (A.leagueId || 'manual');
  }

  function persist() {
    const snap = {
      leagueId: A.leagueId, leagueName: A.leagueName, source: A.source, sleeperDraftId: A.sleeperDraftId,
      budget: A.budget, rosterSpots: A.rosterSpots, lineupReqs: A.lineupReqs,
      teams: A.teams, players: A.players,
    };
    try {
      const key = saveKey();
      localStorage.setItem(key, JSON.stringify(snap));
      localStorage.setItem('auction_last_key', key);
    } catch (_) {}
  }

  function loadSaved(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  function clearSaved() {
    try { localStorage.removeItem(saveKey()); } catch (_) {}
  }

  // ─── Inflation ────────────────────────────────────────────────────────────────

  function calcInflation() {
    const available = A.players.filter(p => !p.drafted);
    const totalBase = available.reduce((s, p) => s + (p.myVal || 0), 0);
    if (totalBase <= 0) return 1;
    // Total dollars still in the pool across all teams (full remaining budgets)
    // The $1/spot reserve only constrains per-player bids, not total available money
    const totalRemaining = A.teams.reduce((s, t) => s + Math.max(0, A.budget - t.spent), 0);
    if (totalRemaining <= 0) return 1;
    return totalRemaining / totalBase;
  }

  // Max a team can bid on one player: remaining budget minus $1 for every other unfilled spot
  function maxBid(team) {
    const remaining = A.budget - team.spent;
    const otherSpots = Math.max(0, A.rosterSpots - team.draftedCount - 1);
    return Math.max(1, remaining - otherSpots);
  }

  function inflatedVal(p) {
    if (!p.myVal) return 0;
    return Math.round(p.myVal * calcInflation());
  }

  // ─── Stats ────────────────────────────────────────────────────────────────────

  function calcStats() {
    const totalBudget = A.teams.length * A.budget;
    const spent = A.teams.reduce((s, t) => s + t.spent, 0);
    const remaining = A.teams.reduce((s, t) => s + (A.budget - t.spent), 0);
    const infl = calcInflation();
    return { totalBudget, spent, remaining, infl };
  }

  function posTiles() {
    const POSITIONS = ['QB', 'RB', 'WR', 'TE'];
    const inflation = calcInflation();
    return POSITIONS.map(pos => {
      const all = A.players.filter(p => normPos(p.pos) === pos);
      const avail = all.filter(p => !p.drafted);
      const totalVal = all.reduce((s, p) => s + (p.myVal || 0), 0);
      const leftVal  = avail.reduce((s, p) => s + (p.myVal || 0), 0);
      const pct = totalVal > 0 ? Math.round(leftVal / totalVal * 100) : 0;
      const top2 = avail
        .map(p => ({ ...p, _inf: Math.round((p.myVal || 0) * inflation) }))
        .sort((a, b) => b._inf - a._inf)
        .slice(0, 2);
      return { pos, pct, top2 };
    });
  }

  // ─── CSV Parsing ──────────────────────────────────────────────────────────────

  const CSV_COL_MAP = {
    player:     ['player', 'name', 'player name', 'full name'],
    pos:        ['position', 'pos'],
    nflTeam:    ['team', 'nfl team', 'nfl_team', 'nfl', 'pro team'],
    myVal:      ['my $ value', 'my $', 'my value', 'myval', 'value', 'my_value', 'my$', 'my dollar value'],
    // "espnVal" is really just "the external $ value" — it also accepts a Sleeper $
    // header, since which one is meaningful depends on the draft's source (see extValLabel()).
    espnVal:    ['espn $ value', 'espn $', 'espn value', 'espnval', 'espn_value', 'espn$', 'espn dollar value',
                 'sleeper $ value', 'sleeper $', 'sleeper value', 'sleeperval', 'sleeper_value', 'sleeper$', 'sleeper dollar value'],
    draftedFor: ['$ drafted for', 'drafted for', 'keeper $', 'keeper price', 'keeper cost', 'draft $', 'kept for', 'kept $'],
    draftedTo:  ['team drafted to', 'drafted to', 'keeper team', 'kept by', 'owner'],
    tier:       ['position tier', 'tier', 'pos tier', 'rank tier', 'player tier'],
    sleeperId:  ['sleeper id', 'sleeper_id', 'sleeperid', 'sleeper player id'],
  };

  function matchHeader(raw) {
    const h = raw.trim().toLowerCase().replace(/\s+/g, ' ');
    for (const [key, aliases] of Object.entries(CSV_COL_MAP)) {
      if (aliases.includes(h)) return key;
    }
    return null;
  }

  // Fallback for when headers don't match any known alias: guess the Player
  // and $ Value columns from the shape of the data itself, using a sample of
  // rows. Only fills in columns not already claimed by a header match.
  function detectColumnsFromContent(lines, col) {
    const sample = lines.slice(1, 21).map(l => splitCSVLine(l));
    const numCols = sample.reduce((m, r) => Math.max(m, r.length), 0);
    const claimed = new Set(Object.values(col));

    if (col.player === undefined) {
      let best = -1, bestScore = 0;
      for (let i = 0; i < numCols; i++) {
        if (claimed.has(i)) continue;
        let hits = 0, total = 0;
        for (const r of sample) {
          const v = (r[i] || '').trim();
          if (!v) continue;
          total++;
          const isNumericLike = !isNaN(parseFloat(v.replace(/[$,\s]/g, ''))) && /^[\d$.,\s]+$/.test(v);
          if (/[A-Za-z]/.test(v) && !isNumericLike) hits++;
        }
        const score = total ? hits / total : 0;
        if (score > bestScore) { bestScore = score; best = i; }
      }
      if (best >= 0 && bestScore >= 0.6) { col.player = best; claimed.add(best); }
    }

    if (col.myVal === undefined) {
      let best = -1, bestScore = -1;
      for (let i = 0; i < numCols; i++) {
        if (claimed.has(i)) continue;
        let hits = 0, total = 0, dollarSigns = 0;
        const vals = [];
        for (const r of sample) {
          const raw = (r[i] || '').trim();
          if (!raw) continue;
          total++;
          if (raw.includes('$')) dollarSigns++;
          const n = parseFloat(raw.replace(/[$,\s]/g, ''));
          if (!isNaN(n) && isFinite(n)) { hits++; vals.push(n); }
        }
        if (!total || hits / total < 0.6) continue;
        let score = hits / total;
        if (dollarSigns > 0) score += 1; // explicit "$" is a near-certain signal
        // Penalize columns that look like a plain 1..N rank/index rather than a value
        const looksSequential = vals.length > 2 && vals.every((v, idx) => v === idx + 1);
        if (looksSequential) score -= 0.5;
        if (score > bestScore) { bestScore = score; best = i; }
      }
      if (best >= 0 && bestScore >= 0.5) { col.myVal = best; claimed.add(best); }
    }
  }

  // Strip $, commas, spaces before parsing — handles "$52", "52.00", "1,200"
  function parseNum(str) {
    const cleaned = String(str || '').replace(/[$,\s]/g, '');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  // Like parseNum but returns NaN for empty/blank strings (used for optional fields)
  function parseNumOpt(str) {
    const cleaned = String(str || '').replace(/[$,\s]/g, '');
    if (!cleaned) return NaN;
    const n = parseFloat(cleaned);
    return n;
  }

  function parseCSV(text) {
    // Strip UTF-8 BOM that Excel sometimes adds
    const clean = text.replace(/^﻿/, '');
    const lines = clean.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error('CSV must have a header row and at least one data row.');

    // Use the same quoted-aware splitter for headers
    const rawHeaders = splitCSVLine(lines[0]);
    const col = {};
    rawHeaders.forEach((h, i) => {
      const key = matchHeader(h);
      if (key && col[key] === undefined) col[key] = i;
    });

    const headerCol = { ...col };
    detectColumnsFromContent(lines, col);

    if (col.player === undefined) {
      const found = rawHeaders.map(h => `"${h}"`).join(', ');
      throw new Error(`Could not find a "Player" column, even by guessing from the data. Found headers: ${found}`);
    }
    if (col.myVal === undefined) {
      const found = rawHeaders.map(h => `"${h}"`).join(', ');
      throw new Error(`Could not find a "$ Value" column, even by guessing from the data. Found headers: ${found}`);
    }

    const players = [];
    for (let i = 1; i < lines.length; i++) {
      const parts = splitCSVLine(lines[i]);
      const name = (parts[col.player] || '').trim();
      if (!name) continue;
      const draftedFor = col.draftedFor !== undefined ? parseNumOpt(parts[col.draftedFor]) : NaN;
      const draftedTo  = col.draftedTo  !== undefined ? (parts[col.draftedTo] || '').trim() : '';
      const isKeeper = !isNaN(draftedFor) && draftedFor > 0 && draftedTo.length > 0;
      players.push({
        name,
        pos:     col.pos     !== undefined ? normPos((parts[col.pos] || '').trim()) || (parts[col.pos] || '').trim().toUpperCase() : '?',
        nflTeam: col.nflTeam !== undefined ? (parts[col.nflTeam] || '').trim().toUpperCase() : '',
        myVal:   col.myVal   !== undefined ? parseNum(parts[col.myVal])  : 0,
        espnVal: col.espnVal !== undefined ? parseNum(parts[col.espnVal]) : 0,
        tier:    col.tier !== undefined ? (parseInt(parts[col.tier]) || 0) : 0,
        drafted:  isKeeper,
        keeper:   isKeeper,
        price:    isKeeper ? draftedFor : 0,
        teamId:   isKeeper ? draftedTo : null,
        _sleeperId: col.sleeperId !== undefined ? (parts[col.sleeperId] || '').trim() : '',
      });
    }
    const guessedCols = Object.keys(col).filter(k => headerCol[k] === undefined);
    return { players, detectedCols: col, guessedCols, rawHeaders };
  }

  function splitCSVLine(line) {
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
      else { cur += c; }
    }
    out.push(cur);
    return out.map(s => s.trim());
  }

  function normPos(raw) {
    if (!raw) return null;
    const p = raw.toUpperCase().trim();
    if (['QB'].includes(p)) return 'QB';
    if (['RB'].includes(p)) return 'RB';
    if (['WR'].includes(p)) return 'WR';
    if (['TE'].includes(p)) return 'TE';
    if (['K', 'PK'].includes(p)) return 'K';
    if (['DST', 'D/ST', 'DEF', 'D', 'ST'].includes(p)) return 'DST';
    return null;
  }

  function normalizePlayerName(name) {
    return name.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  }

  // ─── Starting lineup requirements ──────────────────────────────────────────────
  // {QB,RB,WR,TE,FLEX,K,DST} starter counts. Drives each team's "Needs" hint.
  // Falls back to this shape when nothing's been detected/entered yet.
  const DEFAULT_LINEUP_REQS = { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 2, K: 1, DST: 1 };
  const LINEUP_REQ_POS = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'K', 'DST'];

  // Sleeper's league.roster_positions is a flat array like
  // ['QB','RB','RB','WR','WR','TE','FLEX','FLEX','K','DEF','BN','BN',...] — one
  // entry per roster slot. Bench/reserve slots and IDP slots (not tracked by this
  // tool) are dropped; any flex variant (FLEX/SUPER_FLEX/REC_FLEX) buckets to FLEX.
  function lineupReqsFromSleeperPositions(rosterPositions) {
    const req = { QB: 0, RB: 0, WR: 0, TE: 0, FLEX: 0, K: 0, DST: 0 };
    const FLEX_SLOTS = new Set(['FLEX', 'SUPER_FLEX', 'REC_FLEX', 'WRRB_FLEX']);
    (rosterPositions || []).forEach(slot => {
      if (slot === 'BN' || slot === 'IR' || slot === 'TAXI') return;
      if (slot === 'DEF') { req.DST++; return; }
      if (FLEX_SLOTS.has(slot)) { req.FLEX++; return; }
      if (req[slot] !== undefined) req[slot]++;
      // else: unrecognized/IDP slot (DL, LB, DB, ...) — silently dropped
    });
    return req;
  }

  // ESPN's mSettings → settings.rosterSettings.lineupSlotCounts is keyed by
  // lineup slot ID (per ESPN's stable, widely-used numbering: see the espn-api
  // project's POSITION_MAP). Bench (20), IR (21), and IDP slots are dropped.
  const ESPN_LINEUP_SLOT_MAP = { 0: 'QB', 2: 'RB', 3: 'FLEX', 4: 'WR', 5: 'FLEX', 6: 'TE', 16: 'DST', 17: 'K', 23: 'FLEX' };
  function lineupReqsFromEspnSlotCounts(slotCounts) {
    const req = { QB: 0, RB: 0, WR: 0, TE: 0, FLEX: 0, K: 0, DST: 0 };
    Object.entries(slotCounts || {}).forEach(([slotId, count]) => {
      const pos = ESPN_LINEUP_SLOT_MAP[Number(slotId)];
      if (pos) req[pos] += (parseInt(count) || 0);
    });
    return req;
  }

  // Pushes detected/loaded lineup requirements into the setup form's inputs.
  function applyLineupReqsToInputs(req) {
    if (!req) return;
    document.querySelectorAll('.lineup-req-input').forEach(inp => {
      const pos = inp.dataset.pos;
      if (req[pos] !== undefined) inp.value = req[pos];
    });
  }

  function buildNameMap() {
    const m = new Map();
    A.players.forEach((p, i) => m.set(normalizePlayerName(p.name), i));
    A._nameMap = m;
  }

  // ─── Teams helpers ────────────────────────────────────────────────────────────

  function teamsFromKeepers(players) {
    const seen = new Map();
    players.forEach(p => {
      if (p.keeper && p.teamId) {
        const key = p.teamId;
        if (!seen.has(key)) seen.set(key, { id: key, name: key, spent: 0, draftedCount: 0, players: [] });
        const t = seen.get(key);
        t.spent += p.price;
        t.draftedCount += 1;
        t.players.push({ name: p.name, pos: p.pos, price: p.price, keeper: true });
      }
    });
    return [...seen.values()];
  }

  function findTeamById(id) {
    return A.teams.find(t => t.id === id || t.name === id);
  }

  function teamNeeds(team) {
    // Starter requirements come from the league (Sleeper roster_positions / ESPN
    // lineupSlotCounts) when detected at setup, else the user's manual entry, else
    // a standard-league default. FLEX isn't folded in here — attributing it to a
    // specific position would need real starter-slot assignment, not just a count.
    const req = A.lineupReqs || DEFAULT_LINEUP_REQS;
    const roster = [...team.players];
    const needs = [];
    const filled = { QB:0, RB:0, WR:0, TE:0, K:0, DST:0 };
    roster.forEach(p => {
      const pos = normPos(p.pos) || p.pos;
      if (filled[pos] !== undefined) filled[pos]++;
    });
    for (const pos of ['QB','RB','WR','TE','K','DST']) {
      const need = (req[pos] || 0) - (filled[pos] || 0);
      if (need > 0) needs.push(`${need} ${pos}`);
    }
    return needs;
  }

  function budgetPct(team) {
    return Math.max(0, Math.min(100, team.spent / A.budget * 100));
  }

  function budgetColor(pct) {
    if (pct < 50) return '#5cb85c';
    if (pct < 80) return 'var(--gold)';
    return '#e05252';
  }

  // ─── Modal ────────────────────────────────────────────────────────────────────

  function openModal(playerIdx) {
    const p = A.players[playerIdx];
    if (!p || p.drafted) return;
    A._modalPlayer = playerIdx;
    document.getElementById('modal-player-name').textContent = p.name;
    document.getElementById('modal-player-meta').textContent =
      `${p.pos}  ·  ${p.nflTeam || '—'}  ·  My $: $${p.myVal || '—'}`;
    document.getElementById('modal-err').textContent = '';
    document.getElementById('modal-bid').value = '';

    const sel = document.getElementById('modal-team');
    sel.innerHTML = A.teams.map(t =>
      `<option value="${esc(t.id)}">${esc(t.name)}</option>`
    ).join('');

    document.getElementById('auc-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('modal-bid').focus(), 50);
  }

  function closeModal() {
    document.getElementById('auc-modal').style.display = 'none';
    A._modalPlayer = null;
  }

  function modalBackdropClick(e) {
    if (e.target.id === 'auc-modal') closeModal();
  }

  function saveDraft() {
    const idx = A._modalPlayer;
    if (idx === null || idx === undefined) return;
    const teamId = document.getElementById('modal-team').value;
    const bid = parseFloat(document.getElementById('modal-bid').value);
    const errEl = document.getElementById('modal-err');
    if (!teamId) { errEl.textContent = 'Select a team.'; return; }
    if (isNaN(bid) || bid < 1) { errEl.textContent = 'Enter a valid bid ($1 or more).'; return; }

    const p = A.players[idx];
    const team = findTeamById(teamId);
    if (!team) { errEl.textContent = 'Team not found.'; return; }
    const max = maxBid(team);
    if (bid > max) {
      errEl.textContent = `${team.name} can bid max $${max} (needs $1 per remaining roster spot).`;
      return;
    }

    p.drafted = true;
    p.price = bid;
    p.teamId = teamId;
    team.spent += bid;
    team.draftedCount += 1;
    team.players.push({ name: p.name, pos: p.pos, price: bid, keeper: false });

    persist();
    closeModal();
    renderMain();
  }

  function undoDraft(playerIdx, e) {
    e.stopPropagation();
    const p = A.players[playerIdx];
    if (!p || !p.drafted) return;
    if (p.keeper && !confirm(`Undo ${p.name}'s keeper assignment? This will mark them as available again.`)) return;
    const team = findTeamById(p.teamId);
    if (team) {
      team.spent -= p.price;
      team.draftedCount -= 1;
      team.players = team.players.filter(tp => tp.name !== p.name || tp.price !== p.price);
    }
    p.drafted = false;
    p.keeper = false;
    p.price = 0;
    p.teamId = null;
    persist();
    renderMain();
  }

  // ─── Rendering ────────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function posHtml(pos) {
    const cls = `auc-pos auc-pos-${pos || 'K'}`;
    return `<span class="${cls}">${esc(pos || '?')}</span>`;
  }

  function fmtDollar(n) {
    if (!n && n !== 0) return '—';
    return '$' + Math.round(n);
  }

  // Label for the 3rd $ column (p.espnVal) — the field itself stays named "espnVal"
  // internally (it's just "the external $ value", populated from a CSV column or,
  // for ESPN sources, ESPN's own live auction-value feed), but what it represents
  // depends on which draft source is active.
  function extValLabel() {
    return A.source === 'sleeper' ? 'Sleeper $' : A.source === 'espn' ? 'ESPN $' : 'Other $';
  }

  function renderSetup(resumeData) {
    const espnOptions = A.espnLeagues.length
      ? `<option value="">— No ESPN league (CSV only) —</option>` +
        A.espnLeagues.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('')
      : `<option value="">— No ESPN leagues found —</option>`;

    const sleeperOptions = A.sleeperLeagues.length
      ? `<option value="">— No Sleeper league (CSV only) —</option>` +
        A.sleeperLeagues.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('')
      : `<option value="">— No Sleeper leagues found for ${esc(A._sleeperUsername || '')} —</option>`;

    // Sleeper League field — always visible once the lookup has run, but its content
    // depends on *why* sleeperLeagues might be empty so it's never a silent no-op.
    const sleeperFieldHtml = A._sleeperFetchState === 'no-user' ? `
      <div class="auc-field">
        <label class="auc-label">Sleeper League (optional — enables live sync)</label>
        <div style="font-family:'Crimson Text',serif;font-size:0.86rem;color:var(--brown-light);font-style:italic;">
          Set your Sleeper username in your <a href="/myprofile" style="color:var(--gold);">profile</a> to enable Sleeper live sync.
        </div>
      </div>`
      : A._sleeperFetchState === 'error' ? `
      <div class="auc-field">
        <label class="auc-label">Sleeper League (optional — enables live sync)</label>
        <div style="font-family:'Crimson Text',serif;font-size:0.86rem;color:#e05252;">
          Could not look up Sleeper leagues for "${esc(A._sleeperUsername || '')}" — check the username in your <a href="/myprofile" style="color:var(--gold);">profile</a>.
        </div>
      </div>`
      : A._sleeperFetchState === 'ok' ? `
      <div class="auc-field">
        <label class="auc-label">Sleeper League (optional — enables live sync, auction drafts only)</label>
        <select id="setup-sleeper-league" class="auc-select" onchange="onSleeperLeagueSelect(this.value)">${sleeperOptions}</select>
      </div>
      <div id="sleeper-team-mapping"></div>`
      : '';

    const resumeBanner = resumeData ? `
      <div class="auc-resume-banner">
        <span>Resume saved draft? <strong>${esc(resumeData.leagueName || 'Manual')}</strong>
          — ${resumeData.players ? resumeData.players.filter(p=>p.drafted).length : 0} picks recorded.</span>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button class="auc-btn" style="margin-top:0;" onclick="doResume()">Resume</button>
          <button class="auc-btn auc-btn-ghost" style="margin-top:0;" onclick="dismissResume()">Start Fresh</button>
        </div>
      </div>` : '';

    document.getElementById('app').innerHTML = `
      ${resumeBanner}
      <div class="auc-setup">
        <div class="auc-setup-title">Setup</div>

        ${A.espnLeagues.length ? `
        <div class="auc-field">
          <label class="auc-label">ESPN League (optional — enables live sync)</label>
          <select id="setup-league" class="auc-select" onchange="onLeagueSelect(this.value)">${espnOptions}</select>
          <div style="margin-top:8px;">
            <a href="#" id="espn-csv-export-link" onclick="exportEspnDollarCsv(event)"
              style="font-family:'Crimson Text',serif;font-size:0.82rem;color:var(--gold);text-decoration:underline;cursor:pointer;">
              ⇩ Export ESPN $ values as CSV
            </a>
          </div>
        </div>
        <div id="espn-team-mapping"></div>` : ''}

        ${sleeperFieldHtml}

        <div class="auc-row2">
          <div class="auc-field">
            <label class="auc-label">Budget Per Team ($)</label>
            <input id="setup-budget" class="auc-input" type="number" value="200" min="1">
          </div>
          <div class="auc-field">
            <label class="auc-label">Roster Spots Per Team</label>
            <input id="setup-spots" class="auc-input" type="number" value="16" min="1">
          </div>
        </div>

        <div class="auc-field">
          <label class="auc-label">Starting Lineup <span style="font-family:'Crimson Text',serif;text-transform:none;letter-spacing:normal;font-style:italic;color:var(--brown-light);">— drives each team's "Needs" hint; auto-filled when you pick an ESPN/Sleeper league above</span></label>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            ${LINEUP_REQ_POS.map(pos => `
              <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
                <label style="font-family:'Rye',serif;font-size:0.4rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--brown-light);">${pos}</label>
                <input type="number" min="0" class="auc-input lineup-req-input" data-pos="${pos}"
                  value="${(A.lineupReqs || DEFAULT_LINEUP_REQS)[pos]}"
                  style="width:56px;padding:7px 4px;text-align:center;">
              </div>`).join('')}
          </div>
        </div>

        <div class="auc-field">
          <label class="auc-label">Player Values CSV</label>
          <div class="auc-csv-drop" id="csv-drop" onclick="document.getElementById('csv-file').click()"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleDrop(event)">
            <div class="auc-csv-drop-label">
              Drop CSV here or <span>browse</span>
            </div>
            <div class="auc-csv-hint">
              Only Player + a $ value are required — we'll guess those from the data if headers don't match.<br>
              Also recognized: Position, Team, ESPN/Sleeper $ Value, Tier, $ Drafted For, Team Drafted To, Sleeper ID<br>
              For keepers: fill $ Drafted For + Team Drafted To using the shorthand from your ESPN/Sleeper team mapping above.
            </div>
          </div>
          <input id="csv-file" type="file" accept=".csv,text/csv" style="display:none" onchange="handleFileInput(this)">
          <div id="csv-summary"></div>
        </div>

        <button id="start-btn" class="auc-btn" disabled onclick="startDraft()">Start Tracking</button>
      </div>
    `;
    window._pendingPlayers = null;
    window._resumeData = resumeData;
  }

  function dismissResume() {
    clearSaved();
    renderSetup(null);
  }

  async function doResume() {
    const d = window._resumeData;
    if (!d) return;
    Object.assign(A, {
      leagueId: d.leagueId, leagueName: d.leagueName,
      // Old saves predate the `source` field — a saved leagueId with no source was always ESPN.
      source: d.source || (d.leagueId ? 'espn' : null),
      sleeperDraftId: d.sleeperDraftId || null,
      budget: d.budget, rosterSpots: d.rosterSpots, lineupReqs: d.lineupReqs || null,
      teams: d.teams, players: d.players,
    });
    buildNameMap();
    if (A.source === 'espn' && A.leagueId) startEspnPoll();
    else if (A.source === 'sleeper' && A.sleeperDraftId) await startSleeperPoll();
    renderMain();
  }

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('csv-drop').classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) processCSVFile(file);
  }

  function handleFileInput(input) {
    if (input.files[0]) processCSVFile(input.files[0]);
  }

  function processCSVFile(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      const summaryEl = document.getElementById('csv-summary');
      try {
        const { players, detectedCols, guessedCols, rawHeaders } = parseCSV(ev.target.result || '');
        if (players.length === 0) throw new Error('No player rows found.');
        window._pendingPlayers = players;

        const keepers = players.filter(p => p.keeper).length;
        const keeperTeams = [...new Set(players.filter(p=>p.keeper).map(p=>p.teamId))];

        // Column detection summary
        const COL_LABELS = { player:'Player', pos:'Position', nflTeam:'NFL Team',
          myVal:'My $', espnVal:'ESPN/Sleeper $', draftedFor:'$ Drafted For', draftedTo:'Team Drafted To', tier:'Tier', sleeperId:'Sleeper ID' };
        const colPills = Object.entries(COL_LABELS).map(([k, lbl]) =>
          detectedCols[k] !== undefined
            ? `<span style="color:var(--green-light);margin-right:6px;">✓ ${lbl}${guessedCols.includes(k) ? ' <em style="color:var(--gold);font-style:italic;">(guessed)</em>' : ''}</span>`
            : `<span style="color:var(--brown-light);margin-right:6px;">— ${lbl}</span>`
        ).join('');

        // Team name mapper (appears when keepers detected)
        const teamMapHtml = keeperTeams.length ? `
          <div style="margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,0.08);">
            <div class="auc-label" style="margin-bottom:8px;">Team Names — rename if needed</div>
            <div style="font-family:'Crimson Text',serif;font-size:0.8rem;color:var(--brown-light);margin-bottom:10px;">
              Use any shorthand you like (Nick, James, etc.). These map the "Team Drafted To" values from your CSV.
            </div>
            ${keeperTeams.map(t => `
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                <span style="font-family:'Crimson Text',serif;font-size:0.85rem;color:var(--brown-light);min-width:120px;overflow:hidden;text-overflow:ellipsis;" title="${esc(t)}">${esc(t)}</span>
                <span style="color:var(--brown-light);font-size:0.9rem;">→</span>
                <input class="auc-input team-name-input" data-csv-id="${esc(t)}" value="${esc(t)}"
                  style="flex:1;padding:6px 10px;" placeholder="Display name">
              </div>`).join('')}
          </div>` : '';

        // Keeper preview — shows first 3 keepers parsed so user can verify
        const keeperRows = players.filter(p => p.keeper).slice(0, 3);
        const samplePlayer = players.find(p => p.myVal > 0) || players[0];
        const keeperPreviewHtml = keepers > 0
          ? `<div style="margin-top:10px;">
              <div class="auc-label" style="margin-bottom:6px;">Keepers detected (sample)</div>
              <table style="width:100%;border-collapse:collapse;font-family:'Crimson Text',serif;font-size:0.82rem;">
                <tr style="color:var(--brown-light);">
                  <td style="padding:2px 8px 4px 0;">Player</td>
                  <td style="padding:2px 8px 4px;">Pos</td>
                  <td style="padding:2px 8px 4px;">Price</td>
                  <td style="padding:2px 0 4px;">Team Drafted To</td>
                </tr>
                ${keeperRows.map(p => `<tr style="color:var(--parchment);">
                  <td style="padding:2px 8px 2px 0;">${esc(p.name)}</td>
                  <td style="padding:2px 8px;">${esc(p.pos)}</td>
                  <td style="padding:2px 8px;">$${p.price}</td>
                  <td style="padding:2px 0;">${esc(p.teamId || '—')}</td>
                </tr>`).join('')}
              </table>
            </div>`
          : detectedCols.draftedFor !== undefined
            ? `<div style="margin-top:8px;font-family:'Crimson Text',serif;font-size:0.8rem;color:var(--brown-light);">
                <em>0 keepers detected</em> — "$ Drafted For" column found but all values empty/zero.
                ${samplePlayer ? `Sample My $ parsed: ${samplePlayer.name} = $${samplePlayer.myVal}` : ''}
              </div>`
            : `<div style="margin-top:8px;font-family:'Crimson Text',serif;font-size:0.8rem;color:var(--brown-light);font-style:italic;">
                No keeper columns detected. Use "$ Drafted For" and "Team Drafted To" headers for keepers.
              </div>`;

        summaryEl.innerHTML = `
          <div class="auc-import-summary">
            ✓ ${players.length} players loaded${keepers ? `, ${keepers} keepers` : ''}.
            ${samplePlayer ? `<span style="color:var(--brown-light);font-size:0.85rem;margin-left:8px;">Sample: ${esc(samplePlayer.name)} My$=${samplePlayer.myVal}</span>` : ''}
          </div>
          <div style="font-family:'Crimson Text',serif;font-size:0.8rem;margin-top:8px;line-height:1.8;">${colPills}</div>
          ${keeperPreviewHtml}
          ${teamMapHtml}`;
        document.getElementById('start-btn').disabled = false;
      } catch(err) {
        summaryEl.innerHTML = `<div class="auc-import-summary auc-import-err">✗ ${esc(err.message)}</div>`;
        window._pendingPlayers = null;
        document.getElementById('start-btn').disabled = true;
      }
    };
    reader.readAsText(file);
  }

  async function startDraft() {
    if (!window._pendingPlayers) return;

    // Read ESPN team shorthands from the mapping section
    const espnShorthands = {}; // { espnTeamId: 'Nick' }
    document.querySelectorAll('.espn-team-input').forEach(inp => {
      const id = inp.dataset.espnId;
      const name = inp.value.trim();
      if (id && name) espnShorthands[id] = name;
    });

    // Read Sleeper team shorthands from the mapping section
    const sleeperShorthands = {}; // { rosterId: 'Nick' }
    document.querySelectorAll('.sleeper-team-input').forEach(inp => {
      const id = inp.dataset.sleeperId;
      const name = inp.value.trim();
      if (id && name) sleeperShorthands[id] = name;
    });

    // Read CSV-only keeper team renames (CSV-only mode fallback)
    const csvOverrides = {};
    document.querySelectorAll('.team-name-input').forEach(inp => {
      const csvId = inp.dataset.csvId;
      const display = inp.value.trim();
      if (csvId && display) csvOverrides[csvId] = display;
    });

    A.players = window._pendingPlayers.map(p => ({
      ...p,
      teamId: p.teamId && csvOverrides[p.teamId] ? csvOverrides[p.teamId] : p.teamId,
    }));
    A.budget     = parseInt(document.getElementById('setup-budget')?.value) || 200;
    A.rosterSpots = parseInt(document.getElementById('setup-spots')?.value) || 16;

    const lineupReqs = {};
    document.querySelectorAll('.lineup-req-input').forEach(inp => {
      lineupReqs[inp.dataset.pos] = parseInt(inp.value) || 0;
    });
    A.lineupReqs = lineupReqs;

    const espnSel    = document.getElementById('setup-league');
    const sleeperSel = document.getElementById('setup-sleeper-league');
    const espnVal    = espnSel ? espnSel.value : '';
    const sleeperVal = sleeperSel ? sleeperSel.value : '';

    A.source   = sleeperVal ? 'sleeper' : (espnVal ? 'espn' : null);
    A.leagueId = sleeperVal || espnVal || null;
    A.leagueName = A.source === 'sleeper'
      ? (A.sleeperLeagues.find(l => l.id === sleeperVal) || {}).name || sleeperVal
      : A.source === 'espn'
        ? (A.espnLeagues.find(l => l.id === espnVal) || {}).name || espnVal
        : 'Manual';
    A.espnTeamMap = espnShorthands;
    A.sleeperDraftId = A.source === 'sleeper' ? (window._sleeperDraft?.draft_id || null) : null;

    const useEspn    = A.source === 'espn'    && window._espnTeams    && window._espnTeams.length > 0;
    const useSleeper = A.source === 'sleeper' && window._sleeperTeams && window._sleeperTeams.length > 0;

    if (useEspn) {
      // Build all teams from ESPN, using the user-supplied shorthands as display names
      A.teams = window._espnTeams.map(et => ({
        id:           String(et.id),
        name:         espnShorthands[String(et.id)] || et.name || et.abbrev || `Team ${et.id}`,
        spent:        0,
        draftedCount: 0,
        players:      [],
      }));

      // Merge keeper rows: match player.teamId (shorthand) → team by name, case-insensitive
      A.players.forEach(p => {
        if (!p.keeper || !p.teamId) return;
        const team = A.teams.find(t => t.name.toLowerCase() === p.teamId.toLowerCase());
        if (team) {
          team.spent        += p.price;
          team.draftedCount += 1;
          team.players.push({ name: p.name, pos: p.pos, price: p.price, keeper: true });
        }
      });
    } else if (useSleeper) {
      // Build all teams from Sleeper rosters, using the user-supplied shorthands as display names
      A.teams = window._sleeperTeams.map(st => ({
        id:           st.id,
        name:         sleeperShorthands[st.id] || st.name,
        spent:        0,
        draftedCount: 0,
        players:      [],
      }));

      // Merge keeper rows: match player.teamId (shorthand) → team by name, case-insensitive
      A.players.forEach(p => {
        if (!p.keeper || !p.teamId) return;
        const team = A.teams.find(t => t.name.toLowerCase() === p.teamId.toLowerCase());
        if (team) {
          team.spent        += p.price;
          team.draftedCount += 1;
          team.players.push({ name: p.name, pos: p.pos, price: p.price, keeper: true });
        }
      });
    } else {
      // CSV-only mode: derive teams purely from keeper rows
      A.teams = teamsFromKeepers(A.players);
    }

    buildNameMap();
    persist();
    if (A.source === 'espn' && A.leagueId) startEspnPoll();
    else if (A.source === 'sleeper' && A.sleeperDraftId) await startSleeperPoll();
    renderMain();
  }

  // ─── Main render ──────────────────────────────────────────────────────────────

  function renderMain() {
    const stats = calcStats();
    const inflation = stats.infl;
    const inflPct = Math.round((inflation - 1) * 100);
    const inflCls = inflation < 0.95 ? 'inflation-low' : inflation > 1.15 ? 'inflation-high' : '';

    document.getElementById('app').innerHTML = `
      ${renderStatsBar(stats, inflation, inflPct, inflCls)}
      <div class="auc-main">
        ${renderPoolPanel(inflation)}
        ${renderTeamsPanel()}
      </div>
    `;
    attachPoolHandlers();
  }

  // ─── Player notes (target / avoid / dart throw) ───────────────────────────────
  // A._notePopoverOpen tracks which category's search box is currently expanded
  // (null when closed). Tags live on p.note and are only ever surfaced as a
  // highlight in the pool table — clicking a highlighted name removes the tag.

  const NOTE_CATS = [
    { key: 'target', label: 'Target',      placeholder: 'Add player to target…' },
    { key: 'avoid',  label: 'Avoid',       placeholder: 'Add player to avoid…' },
    { key: 'dart',   label: 'Dart Throw',  placeholder: 'Add dart throw…' },
  ];

  function renderNoteButtons() {
    return `<div class="auc-note-btns">
      ${NOTE_CATS.map(c => `<button type="button"
        class="auc-note-btn auc-note-${c.key}${A._notePopoverOpen === c.key ? ' active' : ''}"
        onclick="toggleNotePopover('${c.key}')">${esc(c.label)}</button>`).join('')}
    </div>`;
  }

  // A blur fired because we're about to re-render the popover ourselves (e.g. right
  // after picking a suggestion) must not be allowed to schedule a close — only a
  // blur caused by the user actually clicking/tabbing away should close it. We
  // track the pending close timer so any in-flight render can cancel it.
  let noteCloseTimer = null;

  function renderNotePopover() {
    const cat = A._notePopoverOpen;
    if (!cat) return '';
    const c = NOTE_CATS.find(x => x.key === cat);
    return `<div class="auc-note-popover">
      <span class="auc-notes-label auc-note-${cat}-label">${esc(c.label)}</span>
      <div class="auc-notes-search-wrap">
        <input type="text" id="note-input-${cat}" class="auc-note-input" placeholder="${esc(c.placeholder)}"
          oninput="noteSearch('${cat}', this.value)"
          onblur="noteCloseTimer = setTimeout(()=>closeNotePopoverIfStill('${cat}'), 150)">
        <div class="auc-note-suggest" id="note-suggest-${cat}"></div>
      </div>
    </div>`;
  }

  function cancelPendingNoteClose() {
    if (noteCloseTimer) { clearTimeout(noteCloseTimer); noteCloseTimer = null; }
  }

  function toggleNotePopover(cat) {
    A._notePopoverOpen = (A._notePopoverOpen === cat) ? null : cat;
    renderMain();
    cancelPendingNoteClose();
    if (A._notePopoverOpen) {
      const inp = document.getElementById('note-input-' + A._notePopoverOpen);
      if (inp) inp.focus();
    }
  }

  function closeNotePopoverIfStill(cat) {
    if (A._notePopoverOpen === cat) { A._notePopoverOpen = null; renderMain(); }
  }

  function noteSearch(cat, val) {
    const el = document.getElementById('note-suggest-' + cat);
    if (!el) return;
    const q = val.trim().toLowerCase();
    if (!q) { el.innerHTML = ''; return; }
    const matches = A.players
      .map((p, i) => ({ p, i }))
      .filter(({ p }) => p.name.toLowerCase().includes(q))
      .slice(0, 8);
    if (!matches.length) { el.innerHTML = `<div class="auc-note-suggest-empty">No matches</div>`; return; }
    el.innerHTML = matches.map(({ p, i }) => `
      <div class="auc-note-suggest-item" onmousedown="event.preventDefault();addNote('${cat}', ${i})">
        ${esc(p.name)}<span class="auc-note-suggest-meta">${esc(p.pos)}${p.nflTeam ? ' · ' + esc(p.nflTeam) : ''}${p.note === cat ? ' · already ' + p.note : p.note ? ' · currently ' + p.note : ''}</span>
      </div>`).join('');
  }

  function addNote(cat, idx) {
    const p = A.players[idx];
    if (!p) return;
    p.note = cat;
    persist();
    renderMain(); // replacing the old (focused) input fires a real blur — cancel the close it just queued
    cancelPendingNoteClose();
    // Keep the popover open with a clean, focused input so another name can be typed right away.
    const inp = document.getElementById('note-input-' + cat);
    if (inp) inp.focus();
  }

  function removeNote(idx) {
    const p = A.players[idx];
    if (!p) return;
    p.note = null;
    persist();
    renderMain();
  }

  function renderStatsBar(stats, inflation, inflPct, inflCls) {
    const tiles = posTiles();
    const TILE_COLORS = { QB: '#e05252', RB: '#5cb85c', WR: '#5bc0de', TE: '#e8734b' };

    return `
    <div class="auc-stats-bar">
      <div class="auc-stats-row1">
        <div class="auc-stat-item">
          <div class="auc-stat-val">$${stats.spent.toLocaleString()}</div>
          <div class="auc-stat-label">Total Spent</div>
        </div>
        <div class="auc-stat-item">
          <div class="auc-stat-val">$${stats.remaining.toLocaleString()}</div>
          <div class="auc-stat-label">Total Remaining</div>
        </div>
        <div class="auc-stat-item">
          <div class="auc-stat-val ${inflCls}">${inflPct >= 0 ? '+' : ''}${inflPct}%</div>
          <div class="auc-stat-label">Inflation</div>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
          <span class="auc-poll-dot${A.pollTimer ? ' live' : ''}"></span>
          <span class="auc-poll-status">${A.pollTimer ? 'Live · ' + (A.source === 'sleeper' ? 'Sleeper' : 'ESPN') : 'Manual mode'}</span>
          ${A._espnValNote ? `<span class="auc-poll-status">${esc(A._espnValNote)}</span>` : ''}
          <button class="auc-btn auc-btn-ghost" style="margin-top:0;padding:5px 14px;font-size:0.38rem;" onclick="goReset()">New Draft</button>
        </div>
      </div>
      <div class="auc-stats-row2">
        ${tiles.map(t => {
          const barColor = TILE_COLORS[t.pos] || 'var(--gold)';
          return `
          <div class="auc-pos-tile">
            <div class="auc-pos-tile-header">
              ${posHtml(t.pos)}
              <span class="auc-pos-tile-pct">${t.pct}% value left</span>
            </div>
            <div class="auc-pos-tile-bar">
              <div class="auc-pos-tile-bar-fill" style="width:${t.pct}%;background:${barColor};"></div>
            </div>
            <div class="auc-pos-tile-players">
              ${t.top2.length ? t.top2.map(p => `
                <div class="auc-pos-player">
                  <span class="auc-pos-player-name">${esc(p.name)}</span>
                  <span class="auc-pos-player-val">${fmtDollar(p._inf)}</span>
                </div>`).join('') : '<div style="font-family:Crimson Text,serif;font-size:0.78rem;color:var(--brown-light);font-style:italic;">None available</div>'}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  function renderPoolPanel(inflation) {
    const POSITIONS = ['ALL','QB','RB','WR','TE','K','DST'];
    const nflTeams = [...new Set(A.players.map(p => p.nflTeam).filter(Boolean))].sort();

    const posPills = POSITIONS.map(pos => `
      <button class="auc-pill${A.posFilter === pos ? ' active' : ''}"
        onclick="setPosFilter('${pos}')">${pos}</button>`).join('');

    const sortPills = [
      ['inflated', 'Inflated $'], ['my', 'My $'], ['espn', extValLabel()]
    ].map(([key, lbl]) => `
      <button class="auc-pill${A.sortBy === key ? ' active' : ''}"
        onclick="setSort('${key}')">${lbl}</button>`).join('');

    const teamOpts = `<option value="">All NFL Teams</option>` +
      nflTeams.map(t => `<option value="${esc(t)}"${A.teamFilter===t?' selected':''}>${esc(t)}</option>`).join('');

    let rows = A.players.map((p, i) => ({ ...p, _i: i, _inf: inflatedVal(p) }));

    // filters
    if (A.posFilter !== 'ALL') rows = rows.filter(p => normPos(p.pos) === A.posFilter || p.pos === A.posFilter);
    if (A.teamFilter) rows = rows.filter(p => p.nflTeam === A.teamFilter);
    if (A.search) {
      const q = A.search.toLowerCase();
      rows = rows.filter(p => p.name.toLowerCase().includes(q));
    }
    if (!A.showDrafted) rows = rows.filter(p => !p.drafted);

    // sort
    rows.sort((a, b) => {
      let va, vb;
      if (A.sortBy === 'my')       { va = a.myVal || 0;   vb = b.myVal || 0; }
      else if (A.sortBy === 'espn') { va = a.espnVal || 0; vb = b.espnVal || 0; }
      else                          { va = a._inf || 0;    vb = b._inf || 0; }
      if (va !== vb) return (vb - va) * A.sortDir * -1;
      return (a.name || '').localeCompare(b.name || '');
    });

    const sortArrow = (key) => A.sortBy === key ? `<span class="sort-arrow">${A.sortDir < 0 ? '↓' : '↑'}</span>` : '';

    const tableBody = rows.length ? rows.map(p => {
      const draftedTeam = p.drafted ? findTeamById(p.teamId) : null;
      const statusHtml = p.drafted
        ? `<span class="drafted-tag">${p.keeper ? '🔒 ' : ''}$${p.price} — ${esc(draftedTeam?.name || p.teamId || '?')}</span>
           <button class="auc-undo-btn" onclick="undoDraft(${p._i}, event)" title="Undo">✕</button>`
        : '<span style="color:var(--green-light)">Available</span>';

      const tierCls = p.tier ? (p.tier % 2 === 1 ? 'tier-odd' : 'tier-even') : '';
      const tierBadge = p.tier
        ? `<span class="auc-tier-badge ${p.tier % 2 === 1 ? 'auc-tier-badge-odd' : 'auc-tier-badge-even'}">T${p.tier}</span>`
        : '';

      return `<tr class="${[p.drafted ? 'drafted' : '', tierCls].filter(Boolean).join(' ')}" data-idx="${p._i}">
        <td>${p.note ? `<span class="auc-name-pill auc-note-${p.note}" onclick="event.stopPropagation();removeNote(${p._i})" title="Click to remove ${esc(p.note)} tag">${esc(p.name)}</span>` : esc(p.name)}${tierBadge}</td>
        <td>${posHtml(p.pos)}</td>
        <td>${esc(p.nflTeam || '—')}</td>
        <td class="num val-my">${fmtDollar(p.myVal)}</td>
        <td class="num val-inf">${p.drafted ? '—' : fmtDollar(p._inf)}</td>

  async function pollEspnDraft() {
    if (!A.leagueId) return;
    try {
      const r = await fetch(
        `${API}/espn/fantasy/${A.leagueId}?view=mDraftDetail&view=mTeam`,
        { credentials: 'include' }
      );
      if (!r.ok) return;
      const d = await r.json();
      const picks = d.draftDetail?.picks || [];
      let changed = false;

      picks.forEach(pick => {
        // Try to match by ESPN player ID first, then fall back to name map
        const espnId = String(pick.playerId);
        const price = pick.bidAmount ?? pick.auctionValue ?? 0;
        const teamId = String(pick.teamId ?? pick.rosterId ?? '');

        // Find the player in our CSV by ESPN ID stored at import, or by name map
        let pIdx = A.players.findIndex(p => p._espnId === espnId);
        if (pIdx < 0 && pick.playerPoolEntry) {
          const fullName = pick.playerPoolEntry?.onTeamId !== undefined
            ? normalizePlayerName(pick.playerPoolEntry?.player?.fullName || '')
            : null;
          if (fullName) pIdx = A._nameMap?.get(fullName) ?? -1;
        }
        if (pIdx < 0) return;

        const p = A.players[pIdx];
        if (p.drafted) return; // already recorded

        const team = A.teams.find(t => t.id === teamId);
        if (!team) return;

        p.drafted = true;
        p.price = price;
        p.teamId = teamId;
        team.spent += price;
        team.draftedCount += 1;
        team.players.push({ name: p.name, pos: p.pos, price, keeper: false });
        changed = true;
      });

      if (changed) { persist(); renderMain(); }
    } catch (_) {}
  }

  function startEspnPoll() {
    if (A.pollTimer) clearInterval(A.pollTimer);
    A.pollTimer = setInterval(pollEspnDraft, 10000);
    pollEspnDraft();
    fetchEspnAuctionValues();
  }

  // Priority: the league's own configured default auction $ list (`draftAuctionValue`
  // — exactly what ESPN's "Edit Salary Cap Draft List" commissioner tool shows/edits)
  // is the real, league-specific number and needs no scoring-format guessing. Only
  // fall back to the generic STANDARD/PPR-averaged rank-type buckets (no half-PPR
  // bucket exists — see below) for any player ESPN hasn't priced into that list yet
  // (draftAuctionValue missing or 0 — treated as "not set", since a real league's
  // default cap list prices every draftable player at $1+).
  function espnValueForEntry(entry) {
    const pl = entry.player || entry;
    if (entry.draftAuctionValue > 0) return Math.round(entry.draftAuctionValue);
    const ranks = pl.draftRanksByRankType || {};
    const std = ranks.STANDARD?.auctionValue;
    const ppr = ranks.PPR?.auctionValue;
    if (std != null && ppr != null) return Math.round((std + ppr) / 2);
    if (ppr != null) return ppr;
    if (std != null) return std;
    if (pl.ownership?.auctionValueAverage != null) return Math.round(pl.ownership.auctionValueAverage);
    return null;
  }

  // Serializes rows (2D array) as a CSV string and triggers a browser download.
  function downloadCsv(filename, rows) {
    const csv = rows.map(r => r.map(v => {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Standalone export: player name + ESPN $ value → CSV, independent of Start
  // Tracking (works pre-draft — kona_player_info is ESPN's player pool, not the
  // draft feed). Values come from espnValueForEntry() — the league's own
  // configured default auction $ list first, falling back to a generic rank-type
  // estimate only for anyone ESPN hasn't priced yet.
  async function exportEspnDollarCsv(e) {
    if (e) e.preventDefault();
    const linkEl = e?.target;
    const origText = linkEl ? linkEl.textContent : null;
    const sel = document.getElementById('setup-league');
    const leagueId = (sel && sel.value) || (A.espnLeagues[0] && A.espnLeagues[0].id);
    if (!leagueId) { alert('No ESPN league available to export from.'); return; }
    if (linkEl) linkEl.textContent = 'Exporting…';
    try {
      const filter = JSON.stringify({
        players: { limit: 4000, sortDraftRanks: { sortPriority: 100, sortAsc: true, value: 'STANDARD' } },
      });
      const r = await fetch(`${API}/espn/fantasy/${leagueId}?view=kona_player_info&scoringPeriodId=0`, {
        credentials: 'include',
        headers: { 'X-Fantasy-Filter': filter },
      });
      if (!r.ok) throw new Error(`ESPN returned ${r.status}`);
      const d = await r.json();
      const list = d.players || [];
      if (!list.length) throw new Error('ESPN returned no players.');

      const rows = [['Player', 'ESPN $ Value']];
      list.forEach(entry => {
        const pl = entry.player || entry;
        const name = pl.fullName;
        if (!name) return;
        const val = espnValueForEntry(entry);
        if (val == null) return;
        rows.push([name, val]);
      });

      if (rows.length <= 1) throw new Error('No auction values found in the response.');
      downloadCsv('espn_dollar_values.csv', rows);
    } catch (err) {
      alert('Export failed: ' + err.message);
    } finally {
      if (linkEl) linkEl.textContent = origText;
    }
  }

  // One-shot pull of ESPN's own auction valuations (not part of the pick-polling
  // loop — this is ESPN's player pool, not the draft feed). Only fills players
  // whose CSV row didn't already provide an ESPN $ value.
  async function fetchEspnAuctionValues() {
    if (!A.leagueId) return;
    A._espnValNote = 'Loading ESPN $…';
    renderMain();
    try {
      const filter = JSON.stringify({
        players: { limit: 4000, sortDraftRanks: { sortPriority: 100, sortAsc: true, value: 'STANDARD' } },
      });
      const r = await fetch(`${API}/espn/fantasy/${A.leagueId}?view=kona_player_info&scoringPeriodId=0`, {
        credentials: 'include',
        headers: { 'X-Fantasy-Filter': filter },
      });
      if (!r.ok) { A._espnValNote = 'ESPN $ fetch failed'; renderMain(); return; }
      const d = await r.json();
      const list = d.players || [];
      if (!list.length) { A._espnValNote = 'ESPN $: no players returned'; renderMain(); return; }

      let filled = 0;
      list.forEach(entry => {
        const pl = entry.player || entry;
        const name = pl.fullName;
        if (!name) return;
        const val = espnValueForEntry(entry);
        if (val == null) return;
        const idx = A._nameMap?.get(normalizePlayerName(name));
        if (idx == null || idx < 0) return;
        const p = A.players[idx];
        if (!p.espnVal) { p.espnVal = Math.round(val); filled++; }
      });

      A._espnValNote = filled ? `✓ ESPN $ filled for ${filled} players` : 'ESPN $: no matching values found';
      if (filled) persist();
      renderMain();
    } catch (_) {
      A._espnValNote = 'ESPN $ fetch error';
      renderMain();
    }
  }

            Give each team a shorthand. Use the <em>same shorthand</em> in your CSV's

          </div>

                <span style="font-family:'Crimson Text',serif;font-size:0.82rem;color:var(--brown-light);

  // Lazy-loaded once per session: id → {name, pos, team}, used to resolve a
  // Sleeper draft pick's player_id into a name we can match against A._nameMap.
  async function loadSleeperPlayerMap() {
    if (A._sleeperPlayers) return;
    try {
      const r = await fetch(`${API}/players`);
      if (!r.ok) return;
      const data = await r.json();
      const m = new Map();
      for (const id in data) {
        const pl = data[id];
        if (!pl?.full_name) continue;
        m.set(id, { name: pl.full_name, pos: pl.position, team: pl.team });
      }
      A._sleeperPlayers = m;
    } catch (_) {}
  }

  async function pollSleeperDraft() {
    if (!A.sleeperDraftId) return;
    try {
      const r = await fetch(`${API}/sleeper/draft/${A.sleeperDraftId}/picks`);
      if (!r.ok) return;
      const picks = await r.json();
      let changed = false;

      (picks || []).forEach(pick => {
        const price = parseFloat(pick.metadata?.amount);
        if (isNaN(price)) return; // not yet a recorded auction bid
        const teamId = String(pick.roster_id ?? '');
        if (!teamId) return;

        // Prefer an exact Sleeper ID match (from CSV), fall back to name matching
        const sleeperId = String(pick.player_id ?? '');
        let pIdx = sleeperId ? A.players.findIndex(p => p._sleeperId && p._sleeperId === sleeperId) : -1;
        if (pIdx < 0) {
          const sp = A._sleeperPlayers?.get(sleeperId);
          if (sp) pIdx = A._nameMap?.get(normalizePlayerName(sp.name)) ?? -1;
        }
        if (pIdx < 0) return;

        const p = A.players[pIdx];
        if (p.drafted) return; // already recorded

        const team = A.teams.find(t => t.id === teamId);
        if (!team) return;

        p.drafted = true;
        p.price = price;
        p.teamId = teamId;
        p._sleeperId = sleeperId;
        team.spent += price;
        team.draftedCount += 1;
        team.players.push({ name: p.name, pos: p.pos, price, keeper: false });
        changed = true;
      });

      if (changed) { persist(); renderMain(); }
    } catch (_) {}
  }

  async function startSleeperPoll() {
    await loadSleeperPlayerMap();
    if (A.pollTimer) clearInterval(A.pollTimer);
    A.pollTimer = setInterval(pollSleeperDraft, 10000);
    pollSleeperDraft();
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────

  async function init() {
    // Must be awaited: fetchSleeperLeagues() reads SharedAuth.getUser().sleeper_username,
    // which isn't populated until SharedAuth.init()'s own /auth/me fetch resolves. ESPN's
    // fetch doesn't have this problem — it hits /api/espn/settings directly via cookie,
    // not through SharedAuth.getUser() — which is why only Sleeper was affected.
    await SharedAuth.init({ chipContainerId: 'auth-chip' });

    // Try to load saved state
    const savedKey = localStorage.getItem('auction_last_key');
    const resumeData = savedKey ? loadSaved(savedKey) : loadSaved('auction_manual');

    // Fetch ESPN + Sleeper leagues if logged in
    await Promise.all([fetchEspnSettings(), fetchSleeperLeagues()]);

    renderSetup(resumeData && resumeData.players && resumeData.players.length ? resumeData : null);
  }

  window.addEventListener('DOMContentLoaded', init);

  // Expose handlers to inline onclick
  window.setPosFilter  = setPosFilter;
  window.setSort       = setSort;
  window.setSearch     = setSearch;
  window.setTeamFilter = setTeamFilter;
  window.setShowDrafted = setShowDrafted;
  window.openModal     = openModal;
  window.closeModal    = closeModal;
  window.modalBackdropClick = modalBackdropClick;
  window.saveDraft     = saveDraft;
  window.undoDraft     = undoDraft;
  window.addTeamPrompt = addTeamPrompt;
  window.renameTeam    = renameTeam;
  window.onLeagueSelect = onLeagueSelect;
  window.exportEspnDollarCsv = exportEspnDollarCsv;
  window.onSleeperLeagueSelect = onSleeperLeagueSelect;
  window.goReset       = goReset;
  window.handleDrop    = handleDrop;
  window.handleFileInput = handleFileInput;
  window.startDraft    = startDraft;
  window.doResume      = doResume;
  window.dismissResume = dismissResume;
  window.noteSearch    = noteSearch;
  window.toggleNotePopover = toggleNotePopover;
  window.closeNotePopoverIfStill = closeNotePopoverIfStill;
  window.addNote       = addNote;
  window.removeNote    = removeNote;
  </script>
